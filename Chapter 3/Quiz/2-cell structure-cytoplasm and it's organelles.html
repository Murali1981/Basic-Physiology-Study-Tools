
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
#app{padding:1.25rem;background:#0f1117;min-height:100vh;border-radius:12px;color:#e2e8f0}

.ctrl{display:flex;align-items:center;justify-content:space-between;background:#161b27;border:0.5px solid #2a3244;border-radius:10px;padding:.7rem 1rem;margin-bottom:1.25rem;gap:8px;flex-wrap:wrap}
.ctrl-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-title{font-size:18px;font-weight:500;color:#94a3b8;white-space:nowrap}
.shuffle-badge{font-size:11px;background:#0d2b1a;color:#3dd68c;border:0.5px solid #3dd68c44;border-radius:99px;padding:2px 10px;display:none}
.shuffle-badge.on{display:inline-block}
.review-badge{font-size:11px;background:#2b1a0d;color:#f59e0b;border:0.5px solid #f59e0b44;border-radius:99px;padding:2px 10px;display:none}
.review-badge.on{display:inline-block}

.rnd-btn{display:flex;align-items:center;gap:6px;padding:.42rem .9rem;background:#1a2a40;border:0.5px solid #3a6ea8;border-radius:8px;color:#60a5fa;font-size:16px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap}
.rnd-btn:hover{background:#1e3554;border-color:#60a5fa}
.rnd-btn svg{transition:transform .4s}
.rnd-btn:hover svg{transform:rotate(180deg)}

.review-btn{display:flex;align-items:center;gap:6px;padding:.42rem .9rem;background:#2b1a0d;border:0.5px solid #f59e0b55;border-radius:8px;color:#f59e0b;font-size:16px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap;position:relative}
.review-btn:hover{background:#3a2310;border-color:#f59e0b}
.review-btn:disabled{opacity:.35;cursor:default}
.review-btn .rbadge{position:absolute;top:-7px;right:-7px;background:#f59e0b;color:#0f1117;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;display:none}
.review-btn .rbadge.show{display:flex}

.combo-wrap{position:relative}
.combo-trigger{display:flex;align-items:center;gap:7px;padding:.42rem .85rem;background:#12192a;border:0.5px solid #2a3244;border-radius:8px;color:#94a3b8;font-size:16px;cursor:pointer;user-select:none;white-space:nowrap;min-width:155px;transition:border-color .15s}
.combo-trigger:hover{border-color:#3a4a6b;color:#cbd5e1}
.combo-trigger.open{border-color:#60a5fa;color:#e2e8f0}
.combo-dot{width:8px;height:8px;border-radius:50%;background:#3dd68c;flex-shrink:0}
.combo-lbl{flex:1}
.combo-arr{opacity:.5;transition:transform .2s}
.combo-trigger.open .combo-arr{transform:rotate(180deg)}
.combo-dd{display:none;position:absolute;top:calc(100% + 5px);left:0;min-width:100%;background:#161b27;border:0.5px solid #2a3244;border-radius:10px;overflow:hidden;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.combo-dd.open{display:block}
.combo-opt{display:flex;align-items:center;gap:8px;padding:.5rem .85rem;font-size:13px;color:#94a3b8;cursor:pointer;border-bottom:0.5px solid #1e2433;transition:background .1s}
.combo-opt:last-child{border-bottom:none}
.combo-opt:hover{background:#1e2433;color:#e2e8f0}
.combo-opt.sel{background:#192030;color:#e2e8f0}
.opt-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.opt-cnt{margin-left:auto;font-size:10px;opacity:.4;background:#2a3244;padding:1px 7px;border-radius:99px}

.score-bar{display:flex;gap:10px;margin-bottom:1.25rem}
.sc{flex:1;background:#161b27;border:0.5px solid #2a3244;border-radius:10px;padding:.65rem 1rem;text-align:center}
.sc-num{font-size:20px;font-weight:500;color:#e2e8f0}
.sc-lbl{font-size:11px;color:#64748b;margin-top:2px;text-transform:uppercase;letter-spacing:.05em}

.mode-banner{display:none;align-items:center;gap:10px;background:#2b1a0d;border:0.5px solid #f59e0b44;border-radius:10px;padding:.65rem 1rem;margin-bottom:1.1rem;font-size:14px;color:#f59e0b}
.mode-banner.show{display:flex}
.mode-banner svg{flex-shrink:0}
.mode-banner-txt{flex:1}
.mode-exit{padding:.3rem .75rem;background:transparent;border:0.5px solid #f59e0b55;border-radius:6px;color:#f59e0b;font-size:12px;cursor:pointer;transition:background .15s}
.mode-exit:hover{background:#3a2310}

.q-list{display:flex;flex-direction:column;gap:1.1rem}
.q-card{background:#161b27;border:0.5px solid #2a3244;border-radius:12px;padding:1.1rem 1.2rem;transition:border-color .2s}
.q-card.answered-correct{border-color:#3dd68c44}
.q-card.answered-wrong{border-color:#f8717144}
.q-card.review-card{border-color:#f59e0b44;background:#1a1208}

.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:.65rem;flex-wrap:wrap}
.q-idx{font-size:15px;color:#64748b}
.q-topic-pill{font-size:15px;padding:2px 10px;border-radius:99px;border:0.5px solid #2a3244;color:#7c8db5;background:#1e2433}
.wrong-pill{font-size:11px;padding:2px 8px;border-radius:99px;border:0.5px solid #f8717144;color:#f87171;background:#2b0d0d}

.q-text{font-size:20px;font-weight:100;color:#e2e8f0;line-height:1.6;margin-bottom:.85rem}
.q-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.q-select-wrap{position:relative;flex:1;min-width:180px}
.q-select{width:100%;padding:.5rem 2.2rem .5rem .85rem;background:#12192a;border:0.5px solid #2a3244;border-radius:8px;color:#94a3b8;font-size:16px;cursor:pointer;appearance:none;-webkit-appearance:none;outline:none;transition:border-color .15s}
.q-select:hover{border-color:#3a4a6b;color:#cbd5e1}
.q-select:focus{border-color:#60a5fa;color:#e2e8f0}
.q-select option{background:#161b27;color:#e2e8f0}
.select-arrow{position:absolute;right:.65rem;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.5}

.check-btn{padding:.48rem 1rem;background:#1a4731;border:0.5px solid #3dd68c55;border-radius:8px;color:#3dd68c;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s}
.check-btn:hover{background:#1f5a3d}
.check-btn:disabled{opacity:.35;cursor:default}

.q-result{display:none;align-items:center;gap:6px;font-size:12px;margin-top:.6rem}
.q-result.show{display:flex}
.result-icon{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.result-correct .result-icon{background:#0d2b1a;color:#3dd68c;border:0.5px solid #3dd68c}
.result-wrong .result-icon{background:#2b0d0d;color:#f87171;border:0.5px solid #f87171}
.result-correct .result-txt{color:#3dd68c;font-size:16px}
.result-wrong .result-txt{color:#f87171;font-size:16px}
.result-reason{font-size:20px;color:#C8FF97;margin-top:.45rem;padding:.55rem .75rem;background:#0d1f2b;border-left:2px solid #3dd68c44;border-radius:0 6px 6px 0;display:none}
.result-reason.show{display:block}

.prev-answer-row{display:none;align-items:center;gap:6px;margin-bottom:.55rem;font-size:13px;color:#64748b}
.prev-answer-row.show{display:flex}
.prev-wrong-chip{background:#2b0d0d;color:#f87171;border:0.5px solid #f8717144;border-radius:6px;padding:2px 8px;font-size:12px}

.submit-row{margin-top:1.5rem;display:flex;justify-content:center}
.submit-btn{padding:.65rem 2rem;background:#1a4731;border:0.5px solid #3dd68c55;border-radius:10px;color:#3dd68c;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.submit-btn:hover{background:#1f5a3d}

.result-screen{text-align:center;padding:2rem 0}
.result-score{font-size:52px;font-weight:500;color:#3dd68c}
.result-label{font-size:17px;color:#64748b;margin:.5rem 0 1.5rem}
.res-breakdown{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:1.5rem}
.indicators{margin-bottom:1.5rem;line-height:2}
.q-dot{display:inline-block;width:16px;height:16px;border-radius:50%;margin:2px;cursor:default}
.res-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.res-btn{padding:.6rem 1.3rem;border-radius:10px;font-size:13px;cursor:pointer}
</style>

</div>

<script>



const MASTER=[
  {topic:"Cytoskeleton",q:"The cytoskeleton is composed mainly of:",cs:["DNA and RNA fibers","Microtubules and microfilaments","Ribosomes and lysosomes","Cristae and matrix proteins"],c:1,r:"The cytoskeleton is a latticework of microtubules and microfilaments. These protein fibers organize the cytoplasm and support organelles."},
  {topic:"Cytoskeleton",q:"How is the cytosol best described structurally?",cs:["A completely homogeneous, unstructured solution","A highly organized structure with protein fibers arranged in a complex latticework","A solid, crystalline matrix","An empty space between organelles"],c:1,r:"Although it appears uniform under an ordinary microscope, the cytosol is highly organized. Microtubules and microfilaments form a complex latticework within it."},
  {topic:"Cytoskeleton",q:"Which technique allows visualization of cytoskeletal structures using antibodies against their proteins?",cs:["Electron diffraction","Fluorescence microscopy","X-ray crystallography","Mass spectrometry"],c:1,r:"Fluorescence microscopy with antibodies against cytoskeletal proteins reveals microtubules and microfilaments. This technique makes the otherwise invisible latticework visible."},
  {topic:"Cytoskeleton",q:"Which contractile proteins, also responsible for muscle contraction, are associated with the cytoskeleton?",cs:["Actin and myosin","Kinesin and dynein","Tubulin and keratin","Collagen and elastin"],c:0,r:"Actin and myosin, the proteins responsible for muscle contraction, are also associated with microfilaments and microtubules. This gives the cytoskeleton a role as the cell's \"musculature.\""},
  {topic:"Cytoskeleton",q:"During cell division, microtubules form the:",cs:["Golgi complex","Spindle apparatus that pulls chromosomes apart","Plasma membrane","Nucleolus"],c:1,r:"Microtubules form the spindle apparatus used in cell division. This structure pulls chromosomes apart into the two daughter cells."},
  {topic:"Cytoskeleton",q:"Microtubules also form the central parts of which cell structures?",cs:["Lysosomes and peroxisomes","Cilia and flagella","Mitochondria and ribosomes","Golgi sacs"],c:1,r:"Cilia and flagella are built around a core of microtubules. These microtubules give the projections their structure and enable movement."},
  {topic:"Cytoskeleton",q:"The molecular motor protein that moves cargo along actin filaments is:",cs:["Myosin","Kinesin","Dynein","Catalase"],c:0,r:"Myosin moves cargo along filaments of actin. Kinesins and dyneins, in contrast, move cargo along microtubules."},
  {topic:"Cytoskeleton",q:"In an axon, which motor protein moves vesicles toward the nerve terminal, and which moves them in the opposite direction?",cs:["Dynein toward the terminal; kinesin in the opposite direction","Kinesin toward the terminal; dynein in the opposite direction","Myosin in both directions","Actin toward the terminal; tubulin in the opposite direction"],c:1,r:"Kinesin transports vesicles toward the axon terminal, while dynein moves vesicles in the opposite direction. Both motors travel along microtubule tracks."},
  {topic:"Cytoskeleton",q:"Stored chemical aggregates in the cytoplasm, such as glycogen granules or melanin granules, are called:",cs:["Inclusions","Cristae","Cisternae","Residual bodies"],c:0,r:"Aggregates of stored chemicals in the cytoplasm are known as inclusions. Examples include glycogen granules, melanin granules, and triglycerides in adipose cells."},

  {topic:"Lysosomes",q:"Before large molecules like proteins and lipids from a food vacuole can enter the cytoplasm, they must first be:",cs:["Exported by exocytosis","Digested into smaller subunits such as amino acids and monosaccharides","Converted into hydrogen peroxide","Stored permanently in the vacuole"],c:1,r:"Large molecules must be digested into smaller subunits before crossing the vacuole membrane. This digestion is carried out by lysosomal enzymes."},
  {topic:"Lysosomes",q:"Lysosomes are membrane-bound organelles that contain approximately how many different enzymes?",cs:["More than 60","About 10","Exactly 2","Around 1,000"],c:0,r:"Lysosomes contain more than 60 different digestive enzymes. These enzymes are kept isolated from the rest of the cytoplasm."},
  {topic:"Lysosomes",q:"A primary lysosome is characterized by:",cs:["Containing only digestive enzymes in an environment more acidic than the cytoplasm","Containing partially digested organelles","Being a lysosome that has fused with a food vacuole","Containing only undigested waste"],c:0,r:"A primary lysosome contains only digestive enzymes (about 40 types) in an acidic environment. It has not yet fused with a food vacuole or other organelle."},
  {topic:"Lysosomes",q:"When a primary lysosome fuses with a food vacuole, the resulting structure is called a:",cs:["Residual body","Peroxisome","Secondary lysosome","Cisterna"],c:2,r:"Fusion of a primary lysosome with a food vacuole forms a secondary lysosome. This structure digests worn-out organelles and ingested material."},
  {topic:"Lysosomes",q:"A lysosome containing undigested wastes is known as a:",cs:["Residual body","Primary lysosome","Peroxisome","Ribosome"],c:0,r:"A residual body is a lysosome containing undigested waste material. These wastes may be eliminated by exocytosis or accumulate as the cell ages."},
  {topic:"Lysosomes",q:"The process by which lysosomes destroy worn-out organelles so they can be replaced is called:",cs:["Phagocytosis","Autophagy","Pinocytosis","Oxidation"],c:1,r:"Autophagy is the process of destroying worn-out organelles within secondary lysosomes. It allows continuous replacement of cellular components."},
  {topic:"Lysosomes",q:"Why are lysosomes sometimes called \"suicide bags\"?",cs:["Because they produce toxic hormones","Because a break in their membrane releases digestive enzymes that can destroy the cell","Because they always cause cancer","Because they contain no enzymes"],c:1,r:"A break in the lysosomal membrane releases digestive enzymes into the cytoplasm, which can destroy the cell. This occurs normally during programmed cell death (apoptosis)."},
  {topic:"Lysosomes",q:"Loss of tissues such as gill pouches during embryonic remodeling is an example of lysosomes participating in:",cs:["Mitosis","Apoptosis (programmed cell death)","Protein synthesis","Oxidative phosphorylation"],c:1,r:"Lysosome-driven programmed cell death (apoptosis) remodels embryonic tissue, such as removing gill pouches. This is a normal part of development."},

  {topic:"Peroxisomes",q:"Peroxisomes are membrane-enclosed organelles that primarily contain enzymes promoting:",cs:["Oxidative reactions","DNA replication","Protein folding only","Cell division"],c:0,r:"Peroxisomes contain enzymes that promote oxidative reactions. These reactions remove hydrogen from organic molecules."},
  {topic:"Peroxisomes",q:"Peroxisomes are particularly large and active in which organ?",cs:["The heart","The liver","The lungs","The skin"],c:1,r:"Although present in most cells, peroxisomes are particularly large and active in the liver. This supports the liver's role in detoxification."},
  {topic:"Peroxisomes",q:"When peroxisomal enzymes remove hydrogen from an organic molecule and transfer it to molecular oxygen, the byproduct formed is:",cs:["Carbon dioxide","Hydrogen peroxide (H2O2)","Lactic acid","Ammonia"],c:1,r:"Transferring hydrogen to molecular oxygen oxidizes the organic molecule and produces hydrogen peroxide. This is a key reaction carried out in peroxisomes."},
  {topic:"Peroxisomes",q:"Much of the alcohol ingested in alcoholic drinks is oxidized into acetaldehyde by:",cs:["Mitochondrial enzymes","Liver peroxisomes","Ribosomal RNA","Golgi enzymes"],c:1,r:"Liver peroxisomes oxidize much of the alcohol from alcoholic drinks into acetaldehyde. This is an example of peroxisomal detoxification of toxic molecules."},
  {topic:"Peroxisomes",q:"The enzyme catalase functions within peroxisomes to:",cs:["Produce hydrogen peroxide","Prevent excessive accumulation of hydrogen peroxide by converting it to water and oxygen","Digest bacteria","Synthesize steroid hormones"],c:1,r:"Catalase catalyzes the breakdown of hydrogen peroxide into water and oxygen. This prevents the toxic buildup of hydrogen peroxide within the cell."},
  {topic:"Peroxisomes",q:"The characteristic fizzing seen when hydrogen peroxide is poured on a wound is caused by the action of:",cs:["Kinesin","Catalase","Dynein","Myosin"],c:1,r:"Catalase, one of the fastest-acting enzymes known, breaks down hydrogen peroxide rapidly. This reaction produces the fizzing observed on a wound."},

  {topic:"Mitochondria",q:"Which cells in the body lack mitochondria?",cs:["Liver cells","Mature red blood cells","Muscle cells","Neurons"],c:1,r:"Mature red blood cells are the exception among body cells in lacking mitochondria. All other cells contain from a hundred to a few thousand mitochondria."},
  {topic:"Mitochondria",q:"Mitochondria primarily function as sites for:",cs:["Protein synthesis","Production of most of the cell's energy","Lipid digestion","DNA storage for the whole cell"],c:1,r:"Mitochondria are the main sites for producing cellular energy. This makes them essential to nearly all cell types."},
  {topic:"Mitochondria",q:"Each mitochondrion is surrounded by:",cs:["A single membrane","An inner and outer membrane separated by an intermembranous space","Only a cell wall","A layer of ribosomes"],c:1,r:"Mitochondria have both an inner and outer membrane, separated by a narrow intermembranous space. This double-membrane structure is key to their function."},
  {topic:"Mitochondria",q:"The folds of the inner mitochondrial membrane that project into the central matrix are called:",cs:["Cisternae","Cristae","Pseudopods","Microvilli"],c:1,r:"Cristae are folds of the inner mitochondrial membrane that project like shelves into the matrix. They compartmentalize the mitochondrion and aid energy generation."},
  {topic:"Mitochondria",q:"Mitochondria are unique among most organelles in that they:",cs:["Contain their own DNA and can reproduce themselves","Are found only in the nucleus","Cannot move within the cell","Lack any membrane"],c:0,r:"Mitochondria contain their own circular, double-stranded DNA and can reproduce themselves. They can also migrate through the cytoplasm."},
  {topic:"Mitochondria",q:"Many scientists believe mitochondria originated from:",cs:["Ribosomal RNA fragments","Separate bacteria-related organisms that invaded ancestral cells and remained in symbiosis","Fragments of the Golgi complex","Byproducts of peroxisome division"],c:1,r:"Mitochondrial DNA resembles a primitive, circular bacterial genome. This supports the theory that mitochondria evolved from symbiotic bacteria-like organisms."},
  {topic:"Mitochondria",q:"Which harmful byproduct do mitochondria produce that can cause oxidative stress and is linked to aging?",cs:["Hydrogen peroxide","Superoxide radicals","Bile acids","Lactic acid"],c:1,r:"Mitochondria produce superoxide radicals, which can cause oxidative stress. Accumulated mutations from this stress in mitochondrial DNA may contribute to aging."},
  {topic:"Mitochondria",q:"Evidence supporting a link between mitochondrial DNA mutations and aging comes from observations that:",cs:["Mice with accelerated mitochondrial DNA mutations age prematurely","Mitochondria disappear entirely with age","Red blood cells live longer with more mitochondria","Peroxisomes replace mitochondria in old cells"],c:0,r:"Mice with accelerated mutations in mitochondrial DNA have been observed to age prematurely. This supports the theory linking mitochondrial DNA damage to aging."},

  {topic:"Ribosomes",q:"Ribosomes are often referred to as the cell's:",cs:["Digestive system","Protein factories","Energy powerhouses","Railway system"],c:1,r:"Ribosomes are called \"protein factories\" because proteins are synthesized there according to mRNA instructions. This is their primary cellular role."},
  {topic:"Ribosomes",q:"Ribosomes can be found:",cs:["Only free in the cytoplasm","Only attached to the nucleus","Free in the cytoplasm and on the surface of the endoplasmic reticulum","Only inside mitochondria"],c:2,r:"Ribosomes occur both freely in the cytoplasm and attached to the endoplasmic reticulum. Both locations are sites of protein synthesis."},
  {topic:"Ribosomes",q:"Approximately how large are ribosomes?",cs:["25 nanometers","25 micrometers","25 millimeters","2.5 nanometers"],c:0,r:"Ribosomes are quite tiny, about 25 nanometers in size. Despite their small size, they carry out essential protein synthesis."},
  {topic:"Ribosomes",q:"Ribosomal subunits are designated 30S and 50S based on their:",cs:["Molecular weight in daltons","Sedimentation rate in a centrifuge, measured in Svedberg units","Electrical charge","Diameter in nanometers"],c:1,r:"The 30S and 50S designations refer to sedimentation rate measured in Svedberg units. This reflects how quickly each subunit settles during centrifugation."},
  {topic:"Ribosomes",q:"Each ribosomal subunit is composed of:",cs:["Only protein","Only ribosomal RNA","Both ribosomal RNA and proteins","DNA and lipids"],c:2,r:"Ribosomal subunits contain both ribosomal RNA and proteins. Together these components carry out the reactions of protein synthesis."},
  {topic:"Ribosomes",q:"Ribosomal RNA molecules that serve as enzymes in ribosomal reactions are called:",cs:["Kinases","Ribozymes","Cristae","Chaperones"],c:1,r:"Ribosomal RNA molecules acting as enzymes are termed ribozymes. This finding contradicted earlier expectations that only proteins could serve as enzymes."},

  {topic:"Endoplasmic Reticulum",q:"The endoplasmic reticulum (ER) is best described as:",cs:["A single flattened sac","A system of membranes within most cells","A type of ribosome","An extension of the nucleolus"],c:1,r:"The ER is a system of membranes found in most cells. It exists in two forms: rough (granular) and smooth (agranular)."},
  {topic:"Endoplasmic Reticulum",q:"What distinguishes a granular (rough) endoplasmic reticulum from an agranular (smooth) one?",cs:["Granular ER bears ribosomes on its surface; agranular ER does not","Granular ER lacks membranes; agranular ER has membranes","Granular ER is found only in muscle; agranular ER is found only in liver","Granular ER produces lipids; agranular ER produces proteins"],c:0,r:"Granular (rough) ER has ribosomes attached to its surface, while agranular (smooth) ER does not. This distinction underlies their different functions."},
  {topic:"Endoplasmic Reticulum",q:"The agranular (smooth) endoplasmic reticulum serves functions such as:",cs:["Ribosome assembly only","Steroid hormone production/inactivation and calcium storage in muscle cells","DNA replication","Waste elimination via residual bodies"],c:1,r:"Smooth ER provides sites for steroid hormone metabolism and calcium storage in striated muscle. It lacks ribosomes, unlike rough ER."},
  {topic:"Endoplasmic Reticulum",q:"The granular (rough) endoplasmic reticulum is especially abundant in cells that are:",cs:["Inactive and dormant","Highly active in protein synthesis and secretion, such as exocrine and endocrine gland cells","Specialized for fat storage only","Found only in red blood cells"],c:1,r:"Rough ER is abundant in cells active in protein synthesis and secretion. Exocrine and endocrine gland cells are good examples."},
  {topic:"Endoplasmic Reticulum",q:"In liver cells, the agranular ER contains enzymes used for:",cs:["Producing red blood cells","Inactivating steroid hormones and many drugs","Building the cytoskeleton","Forming lysosomes exclusively"],c:1,r:"The smooth ER in liver cells inactivates steroid hormones and drugs. This typically converts them into more water-soluble, excretable forms."},
  {topic:"Endoplasmic Reticulum",q:"Long-term use of drugs such as alcohol or phenobarbital can lead to \"tolerance,\" which is accompanied by:",cs:["Shrinkage of the agranular ER","Growth of the agranular ER and increased drug-inactivating enzymes","Complete loss of ER function","Conversion of smooth ER into mitochondria"],c:1,r:"Tolerance to drugs is accompanied by growth of the agranular ER. This increases the amount of enzymes available to inactivate the drug."},

  {topic:"Golgi Complex",q:"The Golgi complex is structurally composed of:",cs:["A single round vesicle","A stack of several flattened, hollow sacs called cisternae","A network of microtubules","A double membrane with cristae"],c:1,r:"The Golgi complex consists of a stack of flattened sacs with internal cavities called cisternae. This structure resembles a stack of hollow pancakes."},
  {topic:"Golgi Complex",q:"Which side of the Golgi stack serves as the entry point for vesicles from the endoplasmic reticulum?",cs:["The side facing the plasma membrane","The side facing the endoplasmic reticulum","Both sides equally","Neither side; entry occurs at the center"],c:1,r:"One side of the Golgi stack faces the ER and receives vesicles containing cellular products. The opposite side faces the plasma membrane."},
  {topic:"Golgi Complex",q:"As a cell product moves through the Golgi complex, it is:",cs:["Left completely unchanged","Chemically modified before being packaged into vesicles","Immediately destroyed","Converted into DNA"],c:1,r:"Cell products are chemically modified as they pass through the Golgi stack. Once processed, they are packaged into vesicles on the side facing the plasma membrane."},
  {topic:"Golgi Complex",q:"Vesicles that bud off from the Golgi complex may become:",cs:["Only mitochondria","Lysosomes or secretory vesicles, among other functions","Only peroxisomes","Only ribosomes"],c:1,r:"Golgi-derived vesicles can become lysosomes, secretory vesicles, or serve other roles. Secretory vesicles release their contents via exocytosis."},
  {topic:"Golgi Complex",q:"Secretory vesicles that bud from the Golgi complex release their contents from the cell by:",cs:["Phagocytosis","Exocytosis","Pinocytosis","Autophagy"],c:1,r:"Secretory vesicles fuse with the plasma membrane and release their contents via exocytosis. This is how many cellular products are exported from the cell."},
];

const TOPIC_COLORS={
  "All Topics":{dot:"#3dd68c"},
  "Cytoskeleton":{dot:"#818cf8"},
  "Lysosomes":{dot:"#f59e0b"},
  "Peroxisomes":{dot:"#34d399"},
  "Mitochondria":{dot:"#f472b6"},
  "Ribosomes":{dot:"#38bdf8"},
  "Endoplasmic Reticulum":{dot:"#a78bfa"},
  "Golgi Complex":{dot:"#fb7185"},
};


const ALL_TOPICS=["All Topics",...new Set(MASTER.map(q=>q.topic))];

let selTopic="All Topics";
let ddOpen=false;
let quizItems=[];
let userAnswers={};
let checkedItems={};
let isReviewMode=false;
let wrongLog={};

const LABELS=['A','B','C','D'];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function buildItems(pool,doShuffle,forReview=false){
  const src=doShuffle?shuffle([...pool]):[...pool];
  return src.map((q,i)=>{
    const indexed=q.cs.map((t,idx)=>({t,ok:idx===q.c}));
    shuffle(indexed);
    return{
      id:forReview?q.origId:i,
      origId:forReview?q.origId:i,
      topic:q.topic,q:q.q,
      choices:indexed.map(x=>x.t),
      correct:indexed.findIndex(x=>x.ok),
      reason:q.r,
      prevWrongChoice:forReview?q.prevWrongChoice:null,
      prevWrongText:forReview?q.prevWrongText:null,
    };
  });
}

function getPool(){return selTopic==="All Topics"?MASTER:MASTER.filter(q=>q.topic===selTopic)}

function buildDropdown(){
  const dd=document.getElementById('cdd');
  dd.innerHTML='';
  ALL_TOPICS.forEach(t=>{
    const cnt=t==="All Topics"?MASTER.length:MASTER.filter(q=>q.topic===t).length;
    const col=TOPIC_COLORS[t]||{dot:"#64748b"};
    const el=document.createElement('div');
    el.className='combo-opt'+(t===selTopic?' sel':'');
    el.innerHTML=`<span class="opt-dot" style="background:${col.dot}"></span><span>${t}</span><span class="opt-cnt">${cnt}</span>`;
    el.onclick=()=>pickTopic(t);
    dd.appendChild(el);
  });
}

function toggleDD(){ddOpen=!ddOpen;document.getElementById('cdd').classList.toggle('open',ddOpen);document.getElementById('ctrig').classList.toggle('open',ddOpen)}
function closeDD(){ddOpen=false;document.getElementById('cdd').classList.remove('open');document.getElementById('ctrig').classList.remove('open')}
function pickTopic(t){
  selTopic=t;
  const col=TOPIC_COLORS[t]||{dot:"#64748b"};
  document.getElementById('clbl').textContent=t;
  document.getElementById('cdot').style.background=col.dot;
  buildDropdown();closeDD();
  exitReviewSilent();
  applyFilter(false);
}
document.addEventListener('click',e=>{if(!document.getElementById('cwrap').contains(e.target))closeDD()});

function applyFilter(doShuffle){
  isReviewMode=false;
  quizItems=buildItems(getPool(),doShuffle);
  userAnswers={};checkedItems={};
  renderList();
  document.getElementById('result-screen').style.display='none';
  document.getElementById('q-list').style.display='flex';
  document.getElementById('submit-row').style.display='flex';
  document.getElementById('mode-banner').classList.remove('show');
  document.getElementById('rbadge').classList.remove('on');
  updateScore();
  updateReviewBtn();
}

function randomize(){
  const svg=document.querySelector('.rnd-btn svg');
  svg.style.transform='rotate(360deg)';
  setTimeout(()=>svg.style.transform='',500);
  document.getElementById('sbadge').classList.add('on');
  exitReviewSilent();
  applyFilter(true);
}

function updateReviewBtn(){
  const wrongKeys=Object.keys(wrongLog);
  const btn=document.getElementById('review-btn');
  const badge=document.getElementById('wrong-count-badge');
  if(wrongKeys.length>0){
    btn.disabled=false;
    badge.textContent=wrongKeys.length;
    badge.classList.add('show');
  } else {
    btn.disabled=true;
    badge.classList.remove('show');
  }
}

function startReview(){
  if(Object.keys(wrongLog).length===0)return;
  isReviewMode=true;
  document.getElementById('sbadge').classList.remove('on');
  document.getElementById('rbadge').classList.add('on');

  const reviewPool=Object.values(wrongLog).map(w=>({
    origId:w.origId,
    topic:w.topic,
    q:w.q,
    cs:w.choices,
    c:w.correctIdx,
    r:w.reason,
    prevWrongChoice:w.userAnswerIdx,
    prevWrongText:w.userAnswerText,
  }));

  quizItems=buildItems(reviewPool,false,true);
  userAnswers={};checkedItems={};

  const banner=document.getElementById('mode-banner');
  document.getElementById('mode-banner-txt').textContent=`Review mode — ${quizItems.length} wrongly answered question${quizItems.length>1?'s':''} from your last attempt. Try them again!`;
  banner.classList.add('show');

  document.getElementById('result-screen').style.display='none';
  document.getElementById('q-list').style.display='flex';
  document.getElementById('submit-row').style.display='flex';
  renderList(true);
  updateScore();
}

function exitReview(){
  exitReviewSilent();
  applyFilter(false);
}
function exitReviewSilent(){
  isReviewMode=false;
  document.getElementById('rbadge').classList.remove('on');
  document.getElementById('mode-banner').classList.remove('show');
}

function renderList(isReview=false){
  const list=document.getElementById('q-list');
  list.innerHTML='';
  quizItems.forEach((q,i)=>{
    const col=TOPIC_COLORS[q.topic]||{dot:"#60a5fa"};
    const card=document.createElement('div');
    card.className='q-card'+(isReview?' review-card':'');
    card.id='qcard-'+i;

    const opts=q.choices.map((ch,ci)=>`<option value="${ci}">${LABELS[ci]}. ${ch}</option>`).join('');
    const prevHtml=isReview&&q.prevWrongText
      ?`<div class="prev-answer-row show">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span style="color:#64748b">Previous wrong answer:</span>
          <span class="prev-wrong-chip">${q.prevWrongText}</span>
        </div>`
      :'';

    card.innerHTML=`
      <div class="q-meta">
        <span class="q-idx">${isReview?'Review':'Q'}${i+1}${isReview?' of '+quizItems.length:' of '+quizItems.length}</span>
        <span class="q-topic-pill" style="color:${col.dot};border-color:${col.dot}44">${q.topic}</span>
        ${isReview?'<span class="wrong-pill">Previously wrong</span>':''}
      </div>
      ${prevHtml}
      <div class="q-text">${q.q}</div>
      <div class="q-row">
        <div class="q-select-wrap">
          <select class="q-select" id="sel-${i}" onchange="onSelect(${i},this.value)">
            <option value="" disabled selected style="color:#64748b">— Select an answer —</option>
            ${opts}
          </select>
          <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <button class="check-btn" id="chk-${i}" onclick="checkOne(${i})" disabled>Check</button>
      </div>
      <div class="q-result" id="res-${i}">
        <div class="result-icon" id="res-icon-${i}"></div>
        <span class="result-txt" id="res-txt-${i}"></span>
      </div>
      <div class="result-reason" id="reason-${i}">${q.reason}</div>
    `;
    list.appendChild(card);
  });
}

function onSelect(i,val){
  userAnswers[i]=parseInt(val);
  const btn=document.getElementById('chk-'+i);
  if(!checkedItems[i])btn.disabled=false;
}

function checkOne(i){
  if(userAnswers[i]===undefined||checkedItems[i])return;
  checkedItems[i]=true;
  const q=quizItems[i];
  const correct=userAnswers[i]===q.correct;
  const card=document.getElementById('qcard-'+i);
  const resEl=document.getElementById('res-'+i);
  const icon=document.getElementById('res-icon-'+i);
  const txt=document.getElementById('res-txt-'+i);
  const reason=document.getElementById('reason-'+i);
  const sel=document.getElementById('sel-'+i);
  const btn=document.getElementById('chk-'+i);

  sel.disabled=true;
  btn.disabled=true;
  btn.textContent=correct?'✓':'✗';
  btn.style.background=correct?'#1a4731':'#2b0d0d';
  btn.style.color=correct?'#3dd68c':'#f87171';
  btn.style.borderColor=correct?'#3dd68c55':'#f8717155';

  card.classList.remove('review-card');
  card.classList.add(correct?'answered-correct':'answered-wrong');
  resEl.className='q-result show '+(correct?'result-correct':'result-wrong');
  icon.textContent=correct?'✓':'✗';
  txt.textContent=correct
    ?'Correct! '+LABELS[q.correct]+' is right.'
    :`Wrong. Correct answer: ${LABELS[q.correct]}. ${q.choices[q.correct]}`;
  reason.classList.add('show');

  const masterKey=isReviewMode?q.origId:i;
  if(!correct){
    wrongLog[masterKey]={
      origId:masterKey,
      topic:q.topic,q:q.q,
      choices:q.choices,
      correctIdx:q.correct,
      reason:q.reason,
      userAnswerIdx:userAnswers[i],
      userAnswerText:LABELS[userAnswers[i]]+'. '+q.choices[userAnswers[i]],
    };
  } else {
    delete wrongLog[masterKey];
  }

  updateScore();
  updateReviewBtn();
}

function updateScore(){
  const total=Object.keys(checkedItems).length;
  const cor=Object.keys(checkedItems).filter(i=>userAnswers[i]===quizItems[i].correct).length;
  const wrg=total-cor;
  const pct=total>0?Math.round((cor/total)*100)+'%':'—';
  document.getElementById('sc-total').textContent=quizItems.length;
  document.getElementById('sc-correct').textContent=cor;
  document.getElementById('sc-wrong').textContent=wrg;
  document.getElementById('sc-pct').textContent=pct;
}

function submitAll(){
  quizItems.forEach((_,i)=>{
    if(!checkedItems[i]&&userAnswers[i]!==undefined)checkOne(i);
  });
  const unanswered=quizItems.filter((_,i)=>userAnswers[i]===undefined&&!checkedItems[i]);
  if(unanswered.length>0){
    const el=document.getElementById('qcard-'+unanswered[0].id);
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  showResult();
}

function showResult(){
  document.getElementById('q-list').style.display='none';
  document.getElementById('submit-row').style.display='none';
  document.getElementById('mode-banner').classList.remove('show');
  const rs=document.getElementById('result-screen');
  rs.style.display='block';
  const total=quizItems.length;
  const cor=Object.keys(checkedItems).filter(i=>userAnswers[i]===quizItems[i].correct).length;
  const wrong=total-cor;
  const pct=total>0?Math.round((cor/total)*100):0;
  const grade=pct>=90?'Excellent! 🎉':pct>=75?'Good work! 👍':pct>=60?'Keep studying! 📖':'Needs more review 💪';
  const dots=quizItems.map((_,i)=>{
    const ok=userAnswers[i]===quizItems[i].correct;
    return`<span class="q-dot" style="background:${checkedItems[i]?(ok?'#3dd68c':'#f87171'):'#2a3244'}" title="Q${i+1}: ${checkedItems[i]?(ok?'Correct':'Wrong'):'Unanswered'}"></span>`;
  }).join('');

  const hasWrong=Object.keys(wrongLog).length>0;

  rs.innerHTML=`
    <div class="result-score">${cor}/${total}</div>
    <div class="result-label">${pct}% — ${grade}</div>
    <div class="res-breakdown">
      <div class="sc"><div class="sc-num" style="color:#3dd68c">${cor}</div><div class="sc-lbl">Correct</div></div>
      <div class="sc"><div class="sc-num" style="color:#f87171">${wrong}</div><div class="sc-lbl">Wrong</div></div>
      <div class="sc"><div class="sc-num" style="color:#f59e0b">${Object.keys(wrongLog).length}</div><div class="sc-lbl">To review</div></div>
    </div>
    <div class="indicators">${dots}</div>
    <div class="res-btns">
      <button class="res-btn" onclick="restart()" style="background:#161b27;color:#cbd5e1;border:0.5px solid #2a3244">↺ Restart</button>
      ${hasWrong?`<button class="res-btn" onclick="startReviewFromResult()" style="background:#2b1a0d;color:#f59e0b;border:0.5px solid #f59e0b55">⚑ Review ${Object.keys(wrongLog).length} wrong</button>`:''}
      <button class="res-btn" onclick="randomize()" style="background:#1a2a40;color:#60a5fa;border:0.5px solid #3a6ea8">🔀 Randomize</button>
    </div>`;
}

function startReviewFromResult(){
  document.getElementById('result-screen').style.display='none';
  startReview();
}

function restart(){
  wrongLog={};
  userAnswers={};checkedItems={};
  isReviewMode=false;
  quizItems=buildItems(getPool(),false);
  renderList();
  document.getElementById('result-screen').style.display='none';
  document.getElementById('q-list').style.display='flex';
  document.getElementById('submit-row').style.display='flex';
  document.getElementById('sbadge').classList.remove('on');
  document.getElementById('rbadge').classList.remove('on');
  document.getElementById('mode-banner').classList.remove('show');
  updateScore();
  updateReviewBtn();
}

buildDropdown();
document.getElementById('cdot').style.background=TOPIC_COLORS["All Topics"].dot;
applyFilter(false);
</script>
