
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
#app{padding:1.25rem;background:#0f1117;min-height:100vh;border-radius:12px;color:#e2e8f0}

.ctrl{display:flex;align-items:center;justify-content:space-between;background:#161b27;border:0.5px solid #2a3244;border-radius:10px;padding:.7rem 1rem;margin-bottom:1.25rem;gap:8px;flex-wrap:wrap}
.ctrl-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-title{font-size:18px;font-weight:500;color:#94a3b8;white-space:nowrap}
.shuffle-badge{font-size:11px;background:#0d2b1a;color:#3dd68c;border:0.5px solid #3dd68c44;border-radius:99px;padding:2px 10px;display:none}
.shuffle-badge.on{display:inline-block}
.review-badge{font-size:11px;background:#2b1a0d;color:#f59e0b;border:0.5px solid #f59e0b44;border-radius:99px;padding:2px 10px;display:none}
.review-badge.on{display:inline-block}

.rnd-btn{display:flex;align-items:center;gap:6px;padding:.42rem .9rem;background:#1a2a40;border:0.5px solid #3a6ea8;border-radius:8px;color:#60a5fa;font-size:16px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap}
.rnd-btn:hover{background:#1e3554;border-color:#60a5fa}
.rnd-btn svg{transition:transform .4s}
.rnd-btn:hover svg{transform:rotate(180deg)}

.review-btn{display:flex;align-items:center;gap:6px;padding:.42rem .9rem;background:#2b1a0d;border:0.5px solid #f59e0b55;border-radius:8px;color:#f59e0b;font-size:16px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap;position:relative}
.review-btn:hover{background:#3a2310;border-color:#f59e0b}
.review-btn:disabled{opacity:.35;cursor:default}
.review-btn .rbadge{position:absolute;top:-7px;right:-7px;background:#f59e0b;color:#0f1117;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;display:none}
.review-btn .rbadge.show{display:flex}

.combo-wrap{position:relative}
.combo-trigger{display:flex;align-items:center;gap:7px;padding:.42rem .85rem;background:#12192a;border:0.5px solid #2a3244;border-radius:8px;color:#94a3b8;font-size:16px;cursor:pointer;user-select:none;white-space:nowrap;min-width:155px;transition:border-color .15s}
.combo-trigger:hover{border-color:#3a4a6b;color:#cbd5e1}
.combo-trigger.open{border-color:#60a5fa;color:#e2e8f0}
.combo-dot{width:8px;height:8px;border-radius:50%;background:#3dd68c;flex-shrink:0}
.combo-lbl{flex:1}
.combo-arr{opacity:.5;transition:transform .2s}
.combo-trigger.open .combo-arr{transform:rotate(180deg)}
.combo-dd{display:none;position:absolute;top:calc(100% + 5px);left:0;min-width:100%;background:#161b27;border:0.5px solid #2a3244;border-radius:10px;overflow:hidden;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.combo-dd.open{display:block}
.combo-opt{display:flex;align-items:center;gap:8px;padding:.5rem .85rem;font-size:13px;color:#94a3b8;cursor:pointer;border-bottom:0.5px solid #1e2433;transition:background .1s}
.combo-opt:last-child{border-bottom:none}
.combo-opt:hover{background:#1e2433;color:#e2e8f0}
.combo-opt.sel{background:#192030;color:#e2e8f0}
.opt-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.opt-cnt{margin-left:auto;font-size:10px;opacity:.4;background:#2a3244;padding:1px 7px;border-radius:99px}

.score-bar{display:flex;gap:10px;margin-bottom:1.25rem}
.sc{flex:1;background:#161b27;border:0.5px solid #2a3244;border-radius:10px;padding:.65rem 1rem;text-align:center}
.sc-num{font-size:20px;font-weight:500;color:#e2e8f0}
.sc-lbl{font-size:11px;color:#64748b;margin-top:2px;text-transform:uppercase;letter-spacing:.05em}

.mode-banner{display:none;align-items:center;gap:10px;background:#2b1a0d;border:0.5px solid #f59e0b44;border-radius:10px;padding:.65rem 1rem;margin-bottom:1.1rem;font-size:14px;color:#f59e0b}
.mode-banner.show{display:flex}
.mode-banner svg{flex-shrink:0}
.mode-banner-txt{flex:1}
.mode-exit{padding:.3rem .75rem;background:transparent;border:0.5px solid #f59e0b55;border-radius:6px;color:#f59e0b;font-size:12px;cursor:pointer;transition:background .15s}
.mode-exit:hover{background:#3a2310}

.q-list{display:flex;flex-direction:column;gap:1.1rem}
.q-card{background:#161b27;border:0.5px solid #2a3244;border-radius:12px;padding:1.1rem 1.2rem;transition:border-color .2s}
.q-card.answered-correct{border-color:#3dd68c44}
.q-card.answered-wrong{border-color:#f8717144}
.q-card.review-card{border-color:#f59e0b44;background:#1a1208}

.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:.65rem;flex-wrap:wrap}
.q-idx{font-size:15px;color:#64748b}
.q-topic-pill{font-size:15px;padding:2px 10px;border-radius:99px;border:0.5px solid #2a3244;color:#7c8db5;background:#1e2433}
.wrong-pill{font-size:11px;padding:2px 8px;border-radius:99px;border:0.5px solid #f8717144;color:#f87171;background:#2b0d0d}

.q-text{font-size:20px;font-weight:100;color:#e2e8f0;line-height:1.6;margin-bottom:.85rem}
.q-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.q-select-wrap{position:relative;flex:1;min-width:180px}
.q-select{width:100%;padding:.5rem 2.2rem .5rem .85rem;background:#12192a;border:0.5px solid #2a3244;border-radius:8px;color:#94a3b8;font-size:16px;cursor:pointer;appearance:none;-webkit-appearance:none;outline:none;transition:border-color .15s}
.q-select:hover{border-color:#3a4a6b;color:#cbd5e1}
.q-select:focus{border-color:#60a5fa;color:#e2e8f0}
.q-select option{background:#161b27;color:#e2e8f0}
.select-arrow{position:absolute;right:.65rem;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.5}

.check-btn{padding:.48rem 1rem;background:#1a4731;border:0.5px solid #3dd68c55;border-radius:8px;color:#3dd68c;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s}
.check-btn:hover{background:#1f5a3d}
.check-btn:disabled{opacity:.35;cursor:default}

.q-result{display:none;align-items:center;gap:6px;font-size:12px;margin-top:.6rem}
.q-result.show{display:flex}
.result-icon{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.result-correct .result-icon{background:#0d2b1a;color:#3dd68c;border:0.5px solid #3dd68c}
.result-wrong .result-icon{background:#2b0d0d;color:#f87171;border:0.5px solid #f87171}
.result-correct .result-txt{color:#3dd68c;font-size:16px}
.result-wrong .result-txt{color:#f87171;font-size:16px}
.result-reason{font-size:20px;color:#C8FF97;margin-top:.45rem;padding:.55rem .75rem;background:#0d1f2b;border-left:2px solid #3dd68c44;border-radius:0 6px 6px 0;display:none}
.result-reason.show{display:block}

.prev-answer-row{display:none;align-items:center;gap:6px;margin-bottom:.55rem;font-size:13px;color:#64748b}
.prev-answer-row.show{display:flex}
.prev-wrong-chip{background:#2b0d0d;color:#f87171;border:0.5px solid #f8717144;border-radius:6px;padding:2px 8px;font-size:12px}

.submit-row{margin-top:1.5rem;display:flex;justify-content:center}
.submit-btn{padding:.65rem 2rem;background:#1a4731;border:0.5px solid #3dd68c55;border-radius:10px;color:#3dd68c;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.submit-btn:hover{background:#1f5a3d}

.result-screen{text-align:center;padding:2rem 0}
.result-score{font-size:52px;font-weight:500;color:#3dd68c}
.result-label{font-size:17px;color:#64748b;margin:.5rem 0 1.5rem}
.res-breakdown{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:1.5rem}
.indicators{margin-bottom:1.5rem;line-height:2}
.q-dot{display:inline-block;width:16px;height:16px;border-radius:50%;margin:2px;cursor:default}
.res-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.res-btn{padding:.6rem 1.3rem;border-radius:10px;font-size:13px;cursor:pointer}
</style>

<div id="app">
  <div class="ctrl">
    <div class="ctrl-left">
      <span class="panel-title">Protein Synthesis and Secretion MCQ</span>
      <span class="shuffle-badge" id="sbadge">✦ Shuffled</span>
      <span class="review-badge" id="rbadge">⚑ Review Mode</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div class="combo-wrap" id="cwrap">
        <div class="combo-trigger" id="ctrig" onclick="toggleDD()">
          <span class="combo-dot" id="cdot"></span>
          <span class="combo-lbl" id="clbl">All Topics</span>
          <svg class="combo-arr" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="combo-dd" id="cdd"></div>
      </div>

      <button class="review-btn" id="review-btn" onclick="startReview()" disabled title="Review wrongly answered questions">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Review
        <span class="rbadge" id="wrong-count-badge"></span>
      </button>

      <button class="rnd-btn" onclick="randomize()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
        </svg>
        Randomize
      </button>
    </div>
  </div>

  <div class="mode-banner" id="mode-banner">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span class="mode-banner-txt" id="mode-banner-txt"></span>
    <button class="mode-exit" onclick="exitReview()">✕ Exit review</button>
  </div>

  <div class="score-bar">
    <div class="sc"><div class="sc-num" id="sc-total">0</div><div class="sc-lbl">Total</div></div>
    <div class="sc"><div class="sc-num" id="sc-correct" style="color:#3dd68c">0</div><div class="sc-lbl">Correct</div></div>
    <div class="sc"><div class="sc-num" id="sc-wrong" style="color:#f87171">0</div><div class="sc-lbl">Wrong</div></div>
    <div class="sc"><div class="sc-num" id="sc-pct">—</div><div class="sc-lbl">Score %</div></div>
  </div>

  <div id="q-list" class="q-list"></div>
  <div class="submit-row" id="submit-row" style="display:none">
    <button class="submit-btn" onclick="submitAll()">Submit all &amp; see results</button>
  </div>
  <div id="result-screen" class="result-screen" style="display:none"></div>
</div>

<script>



const MASTER=[
  {topic:"Ribosomes & Codons",q:"A ribosome is composed of:",cs:["2 molecules of rRNA and 40 proteins","4 molecules of ribosomal RNA and 82 proteins","Only protein, no RNA","100 molecules of mRNA"],c:1,r:"A ribosome consists of 4 rRNA molecules and 82 proteins. These are arranged into two subunits of unequal size."},
  {topic:"Ribosomes & Codons",q:"When mRNA passes through multiple ribosomes simultaneously, the resulting \"string-of-pearls\" structure is called a:",cs:["Spliceosome","Polyribosome (polysome)","Nucleosome","Proteasome"],c:1,r:"A polyribosome, or polysome, forms when mRNA passes through many ribosomes at once. This structure resembles a string of pearls under the electron microscope."},
  {topic:"Ribosomes & Codons",q:"The association of mRNA with ribosomes is required for the process of:",cs:["Genetic transcription","Genetic translation","DNA replication","RNA interference"],c:1,r:"Genetic translation, the production of specific proteins from the mRNA code, requires mRNA to associate with ribosomes. This is distinct from transcription, which occurs in the nucleus."},
  {topic:"Ribosomes & Codons",q:"A base triplet in mRNA that codes for a specific amino acid is called a:",cs:["Codon","Anticodon","Exon","Intron"],c:0,r:"A codon is a three-base sequence in mRNA that codes for a specific amino acid. Codons are read sequentially as mRNA moves through the ribosome."},
  {topic:"Ribosomes & Codons",q:"As mRNA moves through the ribosome, the sequence of codons is translated into:",cs:["A sequence of specific amino acids in a growing polypeptide chain","A new strand of DNA","A sequence of lipids","A carbohydrate chain"],c:0,r:"Codon sequences in mRNA are translated into a corresponding sequence of amino acids. This growing chain becomes the polypeptide product."},
  {topic:"Ribosomes & Codons",q:"Proteins destined to be used within the cell are typically produced by:",cs:["Polyribosomes attached to the Golgi complex","Polyribosomes floating freely in the cytoplasm","Ribosomes located only in the nucleus","Ribosomes attached to mitochondria"],c:1,r:"Proteins for intracellular use are made by free-floating polyribosomes in the cytoplasm. This contrasts with secretory proteins, made on ER-bound ribosomes."},

  {topic:"Triplet Repeat Diseases",q:"Huntington's disease is inherited as what type of genetic trait, located on which chromosome?",cs:["Recessive trait on chromosome 21","Dominant trait on chromosome 4","X-linked trait on the X chromosome","Dominant trait on chromosome 11"],c:1,r:"Huntington's disease is inherited as a dominant trait on chromosome 4. The defective gene involved is called huntingtin."},
  {topic:"Triplet Repeat Diseases",q:"In Huntington's disease, the defective huntingtin gene has a characteristic \"stutter\" involving repetition of which base triplet?",cs:["CAG","TTT","GCC","ATG"],c:0,r:"The huntingtin gene shows a repeated CAG triplet, occurring from 40 up to 250 times. This triplet codes for the amino acid glutamine."},
  {topic:"Triplet Repeat Diseases",q:"The repeated CAG triplet in Huntington's disease causes which amino acid to be repeated in the protein product?",cs:["Glycine","Glutamine","Lysine","Alanine"],c:1,r:"CAG codes for glutamine, so the repeated triplet causes glutamine to be repeated in the defective protein. This repetition is believed to cause neural degeneration."},
  {topic:"Triplet Repeat Diseases",q:"Fragile X syndrome, the most common genetic cause of mental retardation, results from repeats of which base triplet in the FMR1 gene?",cs:["CAG","CGG","TTA","GGC"],c:1,r:"Fragile X syndrome results from 200 or more repeats of CGG in the FMR1 gene. This is structurally similar to the triplet-repeat mechanism seen in Huntington's disease."},

  {topic:"Transfer RNA",q:"Like mRNA and rRNA, tRNA molecules are:",cs:["Double-stranded","Single-stranded","Composed only of protein","Found only in mitochondria"],c:1,r:"tRNA, like mRNA and rRNA, is single-stranded. However, it bends back on itself to form a distinctive structure."},
  {topic:"Transfer RNA",q:"A single tRNA molecule folds into what characteristic shapes?",cs:["A double helix, then a circle","A cloverleaf structure, further twisted into an upside-down L shape","A flat sheet","A perfect sphere"],c:1,r:"tRNA first forms a cloverleaf shape, which further twists into an upside-down \"L.\" This structure positions the anticodon and amino acid-binding site appropriately."},
  {topic:"Transfer RNA",q:"The three nucleotides at one end of a tRNA molecule that are complementary to a specific mRNA codon are called the:",cs:["Codon","Anticodon","Exon","Promoter"],c:1,r:"The anticodon is a three-nucleotide sequence on tRNA. It is complementary to a specific codon on mRNA."},
  {topic:"Transfer RNA",q:"Enzymes that join specific amino acids to the ends of tRNA molecules are called:",cs:["RNA polymerases","Aminoacyl-tRNA synthetase enzymes","Proteases","Ribozymes"],c:1,r:"Aminoacyl-tRNA synthetase enzymes attach amino acids to their corresponding tRNA molecules. Each synthetase is specific for one amino acid and its matching tRNA."},
  {topic:"Transfer RNA",q:"How many different varieties of aminoacyl-tRNA synthetase enzymes exist, corresponding to the number of amino acid types?",cs:["4","20","64","82"],c:1,r:"There are 20 different synthetase enzymes, one for each type of amino acid. Each must recognize both its specific amino acid and the correct tRNA."},

  {topic:"Polypeptide Formation",q:"During polypeptide formation, tRNA anticodons bind to:",cs:["Codons of mRNA as it moves through the ribosome","Other tRNA molecules directly","DNA in the nucleus","Ribosomal proteins only"],c:0,r:"tRNA anticodons bind to complementary codons of mRNA as it passes through the ribosome. Each tRNA delivers a specific amino acid to the growing chain."},
  {topic:"Polypeptide Formation",q:"When the first amino acid detaches from its tRNA and joins the second amino acid, the resulting structure is called a:",cs:["Tripeptide","Dipeptide","Polysome","Codon"],c:1,r:"The joining of the first two amino acids forms a dipeptide. This is the earliest stage of polypeptide chain elongation."},
  {topic:"Polypeptide Formation",q:"At any given moment, the growing polypeptide chain is attached to the mRNA strand by means of:",cs:["Only one tRNA — the one that added the most recent amino acid","All tRNAs used so far","No tRNA at all","The ribosome directly, without tRNA"],c:0,r:"The growing polypeptide chain remains attached via only one tRNA at a time. This is always the tRNA that most recently added an amino acid to the chain."},
  {topic:"Polypeptide Formation",q:"As a polypeptide chain grows, interactions between its amino acids cause it to twist into a helix, forming its:",cs:["Primary structure","Secondary structure","Quaternary structure only","Codon structure"],c:1,r:"Twisting into a helix represents the polypeptide's secondary structure. Further folding and bending produces its tertiary structure."},
  {topic:"Polypeptide Formation",q:"Proteins that help a newly forming polypeptide chain fold into its correct tertiary structure, preventing improper interactions, are called:",cs:["Chaperones","Kinesins","Histones","Ribozymes"],c:0,r:"Chaperones are proteins that assist polypeptide folding as it emerges from the ribosome. They prevent inappropriate interactions that could form toxic aggregates."},
  {topic:"Polypeptide Formation",q:"What can happen if a newly forming polypeptide chain is not properly assisted during folding?",cs:["It always folds perfectly regardless","Similar proteins nearby may aggregate with it to form toxic complexes","It is immediately exported from the cell","It becomes a new gene"],c:1,r:"Without proper folding assistance, nearby similar proteins may aggregate with the new polypeptide. This can produce toxic protein complexes."},
  {topic:"Polypeptide Formation",q:"A newly synthesized protein detaches from its final tRNA:",cs:["Before the first amino acid is added","As the last amino acid is added, completing the chain","Only after leaving the cell","During DNA transcription"],c:1,r:"The completed protein detaches from tRNA once the last amino acid has been added. This marks the end of translation for that polypeptide."},

  {topic:"ER & Golgi Function",q:"Proteins destined for secretion are synthesized by mRNA-ribosome complexes located on the:",cs:["Smooth endoplasmic reticulum","Granular (rough) endoplasmic reticulum","Golgi complex directly","Mitochondrial membrane"],c:1,r:"Secretory proteins are made by ribosomes attached to the granular (rough) ER. This differs from proteins used within the cell, made by free ribosomes."},
  {topic:"ER & Golgi Function",q:"The fluid-filled spaces within the membranes of the endoplasmic reticulum, into which new proteins enter, are called:",cs:["Cisternae","Nucleosomes","Vacuoles","Cristae"],c:0,r:"Cisternae are the fluid-filled internal spaces of the ER membrane system. Newly synthesized secretory proteins enter these spaces for modification."},
  {topic:"ER & Golgi Function",q:"The leader sequence of a secretory protein, consisting of the first 30 or so amino acids, is primarily:",cs:["Hydrophilic","Hydrophobic","Composed of carbohydrates","Composed of DNA"],c:1,r:"The leader sequence of secretory proteins is primarily hydrophobic. This allows it to be attracted to the lipid component of the ER membrane."},
  {topic:"ER & Golgi Function",q:"The leader sequence of a secretory protein functions as a kind of:",cs:["Enzyme","\"Address\" directing the protein into the endoplasmic reticulum","Energy source for the ribosome","Structural support for the Golgi complex"],c:1,r:"The leader sequence acts as an \"address\" that directs the secretory protein into the ER. It is removed once the protein has entered the cisterna."},
  {topic:"ER & Golgi Function",q:"Once a secretory protein is inside the ER cisterna, its leader sequence is:",cs:["Left permanently attached","Enzymatically removed so the protein cannot reenter the cytoplasm","Converted into a carbohydrate","Transported back to the nucleus"],c:1,r:"The leader sequence is enzymatically removed inside the cisterna. This prevents the protein from returning to the cytoplasm."},
  {topic:"ER & Golgi Function",q:"The original single-chain form of insulin, composed of 109 amino acids as it enters the ER cisterna, is called:",cs:["Proinsulin","Preproinsulin","Insulin A-chain","Insulin B-chain"],c:1,r:"Preproinsulin is the initial 109-amino-acid polypeptide that enters the ER cisterna. Its leader sequence is later removed to form proinsulin."},
  {topic:"ER & Golgi Function",q:"How many amino acids make up the leader sequence of preproinsulin?",cs:["First 23 amino acids","First 109 amino acids","First 51 amino acids","First 76 amino acids"],c:0,r:"The first 23 amino acids of preproinsulin serve as its leader sequence. This sequence directs the molecule into the ER cisterna before being removed."},
  {topic:"ER & Golgi Function",q:"After the leader sequence is removed from preproinsulin, the resulting molecule is called:",cs:["Mature insulin","Proinsulin","Ubiquitin","Preinsulin"],c:1,r:"Removal of the leader sequence from preproinsulin produces proinsulin. Proinsulin then folds and is further processed to form mature insulin."},
  {topic:"ER & Golgi Function",q:"Mature, secreted insulin consists of two chains, of what lengths, joined by disulfide bonds?",cs:["21 and 30 amino acids","23 and 109 amino acids","10 and 50 amino acids","76 and 82 amino acids"],c:0,r:"Mature insulin consists of a 21-amino-acid chain and a 30-amino-acid chain. These are joined together by disulfide bonds after removal of the central region of proinsulin."},
  {topic:"ER & Golgi Function",q:"Which of the following is NOT one of the three interrelated functions of the Golgi complex?",cs:["Further modification of proteins, including adding carbohydrates","Separating proteins according to function and destination","Packaging and shipping final products in vesicles","Replicating the cell's entire genome"],c:3,r:"The Golgi complex modifies, sorts, and packages proteins for shipment, but does not replicate the genome. Genome replication occurs in the nucleus during cell division."},
  {topic:"ER & Golgi Function",q:"In the Golgi complex, proteins may be modified by the addition of carbohydrates to form:",cs:["Glycoproteins","Phospholipids","Nucleoproteins","Ribozymes"],c:0,r:"Carbohydrates added to proteins in the Golgi complex form glycoproteins. This is one type of modification proteins undergo before secretion."},
  {topic:"ER & Golgi Function",q:"In the Golgi complex, proteins destined for secretion, incorporation into the cell membrane, and introduction into lysosomes are:",cs:["All mixed together randomly","Separated and packaged into different membrane-enclosed vesicles based on destination","Destroyed if not needed immediately","Sent only to mitochondria"],c:1,r:"The Golgi complex sorts proteins by destination, packaging each type into its own vesicle. This ensures proteins reach their correct location, whether secretion, the cell membrane, or lysosomes."},

  {topic:"Protein Degradation",q:"Regulatory proteins in the cell, such as cyclins, are examples of proteins that:",cs:["Never get degraded","Help control processes like the cell cycle and are rapidly degraded to end their effects","Are only found in mitochondria","Cannot be modified after synthesis"],c:1,r:"Cyclins are regulatory proteins that help control the cell cycle. They are rapidly degraded to quickly end their regulatory effects."},
  {topic:"Protein Degradation",q:"Why are critically important regulatory proteins rapidly degraded rather than simply having their synthesis regulated?",cs:["Rapid degradation allows tighter, faster control of their effects","It saves the cell energy overall","It prevents the proteins from ever being made","It has no functional benefit"],c:0,r:"Rapid degradation allows much tighter control of regulatory proteins than regulating synthesis alone. This ensures their effects end quickly when no longer needed."},
  {topic:"Protein Degradation",q:"Protease enzymes located in which organelle digest many types of cellular proteins?",cs:["Mitochondria","Lysosomes","Ribosomes","Golgi complex"],c:1,r:"Lysosomes contain protease enzymes that digest many cellular proteins. This is one major pathway of protein degradation in the cell."},
  {topic:"Protein Degradation",q:"Besides lysosomal digestion, critical regulatory proteins can also be degraded outside lysosomes through a process that requires:",cs:["Cellular energy (ATP)","Only water","Sunlight","Extra ribosomes"],c:0,r:"Degradation of regulatory proteins outside lysosomes requires cellular energy in the form of ATP. This energy-dependent pathway involves ubiquitin tagging."},
  {topic:"Protein Degradation",q:"Proteins destined for degradation outside the lysosome are first tagged by binding to molecules of:",cs:["Ubiquitin","Histone","Cyclin","Chaperone"],c:0,r:"Ubiquitin, a short 76-amino-acid polypeptide, tags proteins for degradation. This tagging is required before the protein can be broken down by the proteasome."},
  {topic:"Protein Degradation",q:"Ubiquitin is a polypeptide composed of how many amino acids?",cs:["21","30","76","109"],c:2,r:"Ubiquitin consists of 76 amino acids. Its name derives from the Latin word for \"everywhere,\" reflecting its widespread role in tagging proteins."},
  {topic:"Protein Degradation",q:"The large protease enzyme complex that degrades ubiquitin-tagged proteins is called the:",cs:["Ribosome","Proteasome","Spliceosome","Lysosome"],c:1,r:"The proteasome is a large protease complex that degrades ubiquitin-tagged proteins. This process is called proteolysis."},
  {topic:"Protein Degradation",q:"The stepwise progression through the cell cycle is regulated in part by the:",cs:["Stepwise degradation of particular cyclin proteins","Continuous synthesis of ubiquitin with no degradation","Random protein aggregation","Permanent inactivation of the proteasome"],c:0,r:"Progression through the cell cycle requires the stepwise degradation of specific cyclin proteins. This regulated proteolysis, mediated by ubiquitin and the proteasome, controls cell cycle timing."},
];

const TOPIC_COLORS={
  "All Topics":{dot:"#3dd68c"},
  "Ribosomes & Codons":{dot:"#818cf8"},
  "Triplet Repeat Diseases":{dot:"#f59e0b"},
  "Transfer RNA":{dot:"#34d399"},
  "Polypeptide Formation":{dot:"#f472b6"},
  "ER & Golgi Function":{dot:"#38bdf8"},
  "Protein Degradation":{dot:"#a78bfa"},
};

const ALL_TOPICS=["All Topics",...new Set(MASTER.map(q=>q.topic))];

let selTopic="All Topics";
let ddOpen=false;
let quizItems=[];
let userAnswers={};
let checkedItems={};
let isReviewMode=false;
let wrongLog={};

const LABELS=['A','B','C','D'];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function buildItems(pool,doShuffle,forReview=false){
  const src=doShuffle?shuffle([...pool]):[...pool];
  return src.map((q,i)=>{
    const indexed=q.cs.map((t,idx)=>({t,ok:idx===q.c}));
    shuffle(indexed);
    return{
      id:forReview?q.origId:i,
      origId:forReview?q.origId:i,
      topic:q.topic,q:q.q,
      choices:indexed.map(x=>x.t),
      correct:indexed.findIndex(x=>x.ok),
      reason:q.r,
      prevWrongChoice:forReview?q.prevWrongChoice:null,
      prevWrongText:forReview?q.prevWrongText:null,
    };
  });
}

function getPool(){return selTopic==="All Topics"?MASTER:MASTER.filter(q=>q.topic===selTopic)}

function buildDropdown(){
  const dd=document.getElementById('cdd');
  dd.innerHTML='';
  ALL_TOPICS.forEach(t=>{
    const cnt=t==="All Topics"?MASTER.length:MASTER.filter(q=>q.topic===t).length;
    const col=TOPIC_COLORS[t]||{dot:"#64748b"};
    const el=document.createElement('div');
    el.className='combo-opt'+(t===selTopic?' sel':'');
    el.innerHTML=`<span class="opt-dot" style="background:${col.dot}"></span><span>${t}</span><span class="opt-cnt">${cnt}</span>`;
    el.onclick=()=>pickTopic(t);
    dd.appendChild(el);
  });
}

function toggleDD(){ddOpen=!ddOpen;document.getElementById('cdd').classList.toggle('open',ddOpen);document.getElementById('ctrig').classList.toggle('open',ddOpen)}
function closeDD(){ddOpen=false;document.getElementById('cdd').classList.remove('open');document.getElementById('ctrig').classList.remove('open')}
function pickTopic(t){
  selTopic=t;
  const col=TOPIC_COLORS[t]||{dot:"#64748b"};
  document.getElementById('clbl').textContent=t;
  document.getElementById('cdot').style.background=col.dot;
  buildDropdown();closeDD();
  exitReviewSilent();
  applyFilter(false);
}
document.addEventListener('click',e=>{if(!document.getElementById('cwrap').contains(e.target))closeDD()});

function applyFilter(doShuffle){
  isReviewMode=false;
  quizItems=buildItems(getPool(),doShuffle);
  userAnswers={};checkedItems={};
  renderList();
  document.getElementById('result-screen').style.display='none';
  document.getElementById('q-list').style.display='flex';
  document.getElementById('submit-row').style.display='flex';
  document.getElementById('mode-banner').classList.remove('show');
  document.getElementById('rbadge').classList.remove('on');
  updateScore();
  updateReviewBtn();
}

function randomize(){
  const svg=document.querySelector('.rnd-btn svg');
  svg.style.transform='rotate(360deg)';
  setTimeout(()=>svg.style.transform='',500);
  document.getElementById('sbadge').classList.add('on');
  exitReviewSilent();
  applyFilter(true);
}

function updateReviewBtn(){
  const wrongKeys=Object.keys(wrongLog);
  const btn=document.getElementById('review-btn');
  const badge=document.getElementById('wrong-count-badge');
  if(wrongKeys.length>0){
    btn.disabled=false;
    badge.textContent=wrongKeys.length;
    badge.classList.add('show');
  } else {
    btn.disabled=true;
    badge.classList.remove('show');
  }
}

function startReview(){
  if(Object.keys(wrongLog).length===0)return;
  isReviewMode=true;
  document.getElementById('sbadge').classList.remove('on');
  document.getElementById('rbadge').classList.add('on');

  const reviewPool=Object.values(wrongLog).map(w=>({
    origId:w.origId,
    topic:w.topic,
    q:w.q,
    cs:w.choices,
    c:w.correctIdx,
    r:w.reason,
    prevWrongChoice:w.userAnswerIdx,
    prevWrongText:w.userAnswerText,
  }));

  quizItems=buildItems(reviewPool,false,true);
  userAnswers={};checkedItems={};

  const banner=document.getElementById('mode-banner');
  document.getElementById('mode-banner-txt').textContent=`Review mode — ${quizItems.length} wrongly answered question${quizItems.length>1?'s':''} from your last attempt. Try them again!`;
  banner.classList.add('show');

  document.getElementById('result-screen').style.display='none';
  document.getElementById('q-list').style.display='flex';
  document.getElementById('submit-row').style.display='flex';
  renderList(true);
  updateScore();
}

function exitReview(){
  exitReviewSilent();
  applyFilter(false);
}
function exitReviewSilent(){
  isReviewMode=false;
  document.getElementById('rbadge').classList.remove('on');
  document.getElementById('mode-banner').classList.remove('show');
}

function renderList(isReview=false){
  const list=document.getElementById('q-list');
  list.innerHTML='';
  quizItems.forEach((q,i)=>{
    const col=TOPIC_COLORS[q.topic]||{dot:"#60a5fa"};
    const card=document.createElement('div');
    card.className='q-card'+(isReview?' review-card':'');
    card.id='qcard-'+i;

    const opts=q.choices.map((ch,ci)=>`<option value="${ci}">${LABELS[ci]}. ${ch}</option>`).join('');
    const prevHtml=isReview&&q.prevWrongText
      ?`<div class="prev-answer-row show">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span style="color:#64748b">Previous wrong answer:</span>
          <span class="prev-wrong-chip">${q.prevWrongText}</span>
        </div>`
      :'';

    card.innerHTML=`
      <div class="q-meta">
        <span class="q-idx">${isReview?'Review':'Q'}${i+1}${isReview?' of '+quizItems.length:' of '+quizItems.length}</span>
        <span class="q-topic-pill" style="color:${col.dot};border-color:${col.dot}44">${q.topic}</span>
        ${isReview?'<span class="wrong-pill">Previously wrong</span>':''}
      </div>
      ${prevHtml}
      <div class="q-text">${q.q}</div>
      <div class="q-row">
        <div class="q-select-wrap">
          <select class="q-select" id="sel-${i}" onchange="onSelect(${i},this.value)">
            <option value="" disabled selected style="color:#64748b">— Select an answer —</option>
            ${opts}
          </select>
          <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <button class="check-btn" id="chk-${i}" onclick="checkOne(${i})" disabled>Check</button>
      </div>
      <div class="q-result" id="res-${i}">
        <div class="result-icon" id="res-icon-${i}"></div>
        <span class="result-txt" id="res-txt-${i}"></span>
      </div>
      <div class="result-reason" id="reason-${i}">${q.reason}</div>
    `;
    list.appendChild(card);
  });
}

function onSelect(i,val){
  userAnswers[i]=parseInt(val);
  const btn=document.getElementById('chk-'+i);
  if(!checkedItems[i])btn.disabled=false;
}

function checkOne(i){
  if(userAnswers[i]===undefined||checkedItems[i])return;
  checkedItems[i]=true;
  const q=quizItems[i];
  const correct=userAnswers[i]===q.correct;
  const card=document.getElementById('qcard-'+i);
  const resEl=document.getElementById('res-'+i);
  const icon=document.getElementById('res-icon-'+i);
  const txt=document.getElementById('res-txt-'+i);
  const reason=document.getElementById('reason-'+i);
  const sel=document.getElementById('sel-'+i);
  const btn=document.getElementById('chk-'+i);

  sel.disabled=true;
  btn.disabled=true;
  btn.textContent=correct?'✓':'✗';
  btn.style.background=correct?'#1a4731':'#2b0d0d';
  btn.style.color=correct?'#3dd68c':'#f87171';
  btn.style.borderColor=correct?'#3dd68c55':'#f8717155';

  card.classList.remove('review-card');
  card.classList.add(correct?'answered-correct':'answered-wrong');
  resEl.className='q-result show '+(correct?'result-correct':'result-wrong');
  icon.textContent=correct?'✓':'✗';
  txt.textContent=correct
    ?'Correct! '+LABELS[q.correct]+' is right.'
    :`Wrong. Correct answer: ${LABELS[q.correct]}. ${q.choices[q.correct]}`;
  reason.classList.add('show');

  const masterKey=isReviewMode?q.origId:i;
  if(!correct){
    wrongLog[masterKey]={
      origId:masterKey,
      topic:q.topic,q:q.q,
      choices:q.choices,
      correctIdx:q.correct,
      reason:q.reason,
      userAnswerIdx:userAnswers[i],
      userAnswerText:LABELS[userAnswers[i]]+'. '+q.choices[userAnswers[i]],
    };
  } else {
    delete wrongLog[masterKey];
  }

  updateScore();
  updateReviewBtn();
}

function updateScore(){
  const total=Object.keys(checkedItems).length;
  const cor=Object.keys(checkedItems).filter(i=>userAnswers[i]===quizItems[i].correct).length;
  const wrg=total-cor;
  const pct=total>0?Math.round((cor/total)*100)+'%':'—';
  document.getElementById('sc-total').textContent=quizItems.length;
  document.getElementById('sc-correct').textContent=cor;
  document.getElementById('sc-wrong').textContent=wrg;
  document.getElementById('sc-pct').textContent=pct;
}

function submitAll(){
  quizItems.forEach((_,i)=>{
    if(!checkedItems[i]&&userAnswers[i]!==undefined)checkOne(i);
  });
  const unanswered=quizItems.filter((_,i)=>userAnswers[i]===undefined&&!checkedItems[i]);
  if(unanswered.length>0){
    const el=document.getElementById('qcard-'+unanswered[0].id);
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  showResult();
}

function showResult(){
  document.getElementById('q-list').style.display='none';
  document.getElementById('submit-row').style.display='none';
  document.getElementById('mode-banner').classList.remove('show');
  const rs=document.getElementById('result-screen');
  rs.style.display='block';
  const total=quizItems.length;
  const cor=Object.keys(checkedItems).filter(i=>userAnswers[i]===quizItems[i].correct).length;
  const wrong=total-cor;
  const pct=total>0?Math.round((cor/total)*100):0;
  const grade=pct>=90?'Excellent! 🎉':pct>=75?'Good work! 👍':pct>=60?'Keep studying! 📖':'Needs more review 💪';
  const dots=quizItems.map((_,i)=>{
    const ok=userAnswers[i]===quizItems[i].correct;
    return`<span class="q-dot" style="background:${checkedItems[i]?(ok?'#3dd68c':'#f87171'):'#2a3244'}" title="Q${i+1}: ${checkedItems[i]?(ok?'Correct':'Wrong'):'Unanswered'}"></span>`;
  }).join('');

  const hasWrong=Object.keys(wrongLog).length>0;

  rs.innerHTML=`
    <div class="result-score">${cor}/${total}</div>
    <div class="result-label">${pct}% — ${grade}</div>
    <div class="res-breakdown">
      <div class="sc"><div class="sc-num" style="color:#3dd68c">${cor}</div><div class="sc-lbl">Correct</div></div>
      <div class="sc"><div class="sc-num" style="color:#f87171">${wrong}</div><div class="sc-lbl">Wrong</div></div>
      <div class="sc"><div class="sc-num" style="color:#f59e0b">${Object.keys(wrongLog).length}</div><div class="sc-lbl">To review</div></div>
    </div>
    <div class="indicators">${dots}</div>
    <div class="res-btns">
      <button class="res-btn" onclick="restart()" style="background:#161b27;color:#cbd5e1;border:0.5px solid #2a3244">↺ Restart</button>
      ${hasWrong?`<button class="res-btn" onclick="startReviewFromResult()" style="background:#2b1a0d;color:#f59e0b;border:0.5px solid #f59e0b55">⚑ Review ${Object.keys(wrongLog).length} wrong</button>`:''}
      <button class="res-btn" onclick="randomize()" style="background:#1a2a40;color:#60a5fa;border:0.5px solid #3a6ea8">🔀 Randomize</button>
    </div>`;
}

function startReviewFromResult(){
  document.getElementById('result-screen').style.display='none';
  startReview();
}

function restart(){
  wrongLog={};
  userAnswers={};checkedItems={};
  isReviewMode=false;
  quizItems=buildItems(getPool(),false);
  renderList();
  document.getElementById('result-screen').style.display='none';
  document.getElementById('q-list').style.display='flex';
  document.getElementById('submit-row').style.display='flex';
  document.getElementById('sbadge').classList.remove('on');
  document.getElementById('rbadge').classList.remove('on');
  document.getElementById('mode-banner').classList.remove('show');
  updateScore();
  updateReviewBtn();
}

buildDropdown();
document.getElementById('cdot').style.background=TOPIC_COLORS["All Topics"].dot;
applyFilter(false);
</script>
