
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
#app{padding:1.25rem;background:#0f1117;min-height:100vh;border-radius:12px;color:#e2e8f0}

.ctrl{display:flex;align-items:center;justify-content:space-between;background:#161b27;border:0.5px solid #2a3244;border-radius:10px;padding:.7rem 1rem;margin-bottom:1.25rem;gap:8px;flex-wrap:wrap}
.ctrl-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-title{font-size:18px;font-weight:500;color:#94a3b8;white-space:nowrap}
.shuffle-badge{font-size:11px;background:#0d2b1a;color:#3dd68c;border:0.5px solid #3dd68c44;border-radius:99px;padding:2px 10px;display:none}
.shuffle-badge.on{display:inline-block}
.review-badge{font-size:11px;background:#2b1a0d;color:#f59e0b;border:0.5px solid #f59e0b44;border-radius:99px;padding:2px 10px;display:none}
.review-badge.on{display:inline-block}

.rnd-btn{display:flex;align-items:center;gap:6px;padding:.42rem .9rem;background:#1a2a40;border:0.5px solid #3a6ea8;border-radius:8px;color:#60a5fa;font-size:16px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap}
.rnd-btn:hover{background:#1e3554;border-color:#60a5fa}
.rnd-btn svg{transition:transform .4s}
.rnd-btn:hover svg{transform:rotate(180deg)}

.review-btn{display:flex;align-items:center;gap:6px;padding:.42rem .9rem;background:#2b1a0d;border:0.5px solid #f59e0b55;border-radius:8px;color:#f59e0b;font-size:16px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap;position:relative}
.review-btn:hover{background:#3a2310;border-color:#f59e0b}
.review-btn:disabled{opacity:.35;cursor:default}
.review-btn .rbadge{position:absolute;top:-7px;right:-7px;background:#f59e0b;color:#0f1117;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;display:none}
.review-btn .rbadge.show{display:flex}

.combo-wrap{position:relative}
.combo-trigger{display:flex;align-items:center;gap:7px;padding:.42rem .85rem;background:#12192a;border:0.5px solid #2a3244;border-radius:8px;color:#94a3b8;font-size:16px;cursor:pointer;user-select:none;white-space:nowrap;min-width:155px;transition:border-color .15s}
.combo-trigger:hover{border-color:#3a4a6b;color:#cbd5e1}
.combo-trigger.open{border-color:#60a5fa;color:#e2e8f0}
.combo-dot{width:8px;height:8px;border-radius:50%;background:#3dd68c;flex-shrink:0}
.combo-lbl{flex:1}
.combo-arr{opacity:.5;transition:transform .2s}
.combo-trigger.open .combo-arr{transform:rotate(180deg)}
.combo-dd{display:none;position:absolute;top:calc(100% + 5px);left:0;min-width:100%;background:#161b27;border:0.5px solid #2a3244;border-radius:10px;overflow:hidden;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.combo-dd.open{display:block}
.combo-opt{display:flex;align-items:center;gap:8px;padding:.5rem .85rem;font-size:13px;color:#94a3b8;cursor:pointer;border-bottom:0.5px solid #1e2433;transition:background .1s}
.combo-opt:last-child{border-bottom:none}
.combo-opt:hover{background:#1e2433;color:#e2e8f0}
.combo-opt.sel{background:#192030;color:#e2e8f0}
.opt-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.opt-cnt{margin-left:auto;font-size:10px;opacity:.4;background:#2a3244;padding:1px 7px;border-radius:99px}

.score-bar{display:flex;gap:10px;margin-bottom:1.25rem}
.sc{flex:1;background:#161b27;border:0.5px solid #2a3244;border-radius:10px;padding:.65rem 1rem;text-align:center}
.sc-num{font-size:20px;font-weight:500;color:#e2e8f0}
.sc-lbl{font-size:11px;color:#64748b;margin-top:2px;text-transform:uppercase;letter-spacing:.05em}

.mode-banner{display:none;align-items:center;gap:10px;background:#2b1a0d;border:0.5px solid #f59e0b44;border-radius:10px;padding:.65rem 1rem;margin-bottom:1.1rem;font-size:14px;color:#f59e0b}
.mode-banner.show{display:flex}
.mode-banner svg{flex-shrink:0}
.mode-banner-txt{flex:1}
.mode-exit{padding:.3rem .75rem;background:transparent;border:0.5px solid #f59e0b55;border-radius:6px;color:#f59e0b;font-size:12px;cursor:pointer;transition:background .15s}
.mode-exit:hover{background:#3a2310}

.q-list{display:flex;flex-direction:column;gap:1.1rem}
.q-card{background:#161b27;border:0.5px solid #2a3244;border-radius:12px;padding:1.1rem 1.2rem;transition:border-color .2s}
.q-card.answered-correct{border-color:#3dd68c44}
.q-card.answered-wrong{border-color:#f8717144}
.q-card.review-card{border-color:#f59e0b44;background:#1a1208}

.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:.65rem;flex-wrap:wrap}
.q-idx{font-size:15px;color:#64748b}
.q-topic-pill{font-size:15px;padding:2px 10px;border-radius:99px;border:0.5px solid #2a3244;color:#7c8db5;background:#1e2433}
.wrong-pill{font-size:11px;padding:2px 8px;border-radius:99px;border:0.5px solid #f8717144;color:#f87171;background:#2b0d0d}

.q-text{font-size:20px;font-weight:100;color:#e2e8f0;line-height:1.6;margin-bottom:.85rem}
.q-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.q-select-wrap{position:relative;flex:1;min-width:180px}
.q-select{width:100%;padding:.5rem 2.2rem .5rem .85rem;background:#12192a;border:0.5px solid #2a3244;border-radius:8px;color:#94a3b8;font-size:16px;cursor:pointer;appearance:none;-webkit-appearance:none;outline:none;transition:border-color .15s}
.q-select:hover{border-color:#3a4a6b;color:#cbd5e1}
.q-select:focus{border-color:#60a5fa;color:#e2e8f0}
.q-select option{background:#161b27;color:#e2e8f0}
.select-arrow{position:absolute;right:.65rem;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.5}

.check-btn{padding:.48rem 1rem;background:#1a4731;border:0.5px solid #3dd68c55;border-radius:8px;color:#3dd68c;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s}
.check-btn:hover{background:#1f5a3d}
.check-btn:disabled{opacity:.35;cursor:default}

.q-result{display:none;align-items:center;gap:6px;font-size:12px;margin-top:.6rem}
.q-result.show{display:flex}
.result-icon{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.result-correct .result-icon{background:#0d2b1a;color:#3dd68c;border:0.5px solid #3dd68c}
.result-wrong .result-icon{background:#2b0d0d;color:#f87171;border:0.5px solid #f87171}
.result-correct .result-txt{color:#3dd68c;font-size:16px}
.result-wrong .result-txt{color:#f87171;font-size:16px}
.result-reason{font-size:20px;color:#C8FF97;margin-top:.45rem;padding:.55rem .75rem;background:#0d1f2b;border-left:2px solid #3dd68c44;border-radius:0 6px 6px 0;display:none}
.result-reason.show{display:block}

.prev-answer-row{display:none;align-items:center;gap:6px;margin-bottom:.55rem;font-size:13px;color:#64748b}
.prev-answer-row.show{display:flex}
.prev-wrong-chip{background:#2b0d0d;color:#f87171;border:0.5px solid #f8717144;border-radius:6px;padding:2px 8px;font-size:12px}

.submit-row{margin-top:1.5rem;display:flex;justify-content:center}
.submit-btn{padding:.65rem 2rem;background:#1a4731;border:0.5px solid #3dd68c55;border-radius:10px;color:#3dd68c;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.submit-btn:hover{background:#1f5a3d}

.result-screen{text-align:center;padding:2rem 0}
.result-score{font-size:52px;font-weight:500;color:#3dd68c}
.result-label{font-size:17px;color:#64748b;margin:.5rem 0 1.5rem}
.res-breakdown{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:1.5rem}
.indicators{margin-bottom:1.5rem;line-height:2}
.q-dot{display:inline-block;width:16px;height:16px;border-radius:50%;margin:2px;cursor:default}
.res-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.res-btn{padding:.6rem 1.3rem;border-radius:10px;font-size:13px;cursor:pointer}
</style>

<div id="app">
  <div class="ctrl">
    <div class="ctrl-left">
      <span class="panel-title">Cell Nucleus and Gene Expression MCQ</span>
      <span class="shuffle-badge" id="sbadge">✦ Shuffled</span>
      <span class="review-badge" id="rbadge">⚑ Review Mode</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div class="combo-wrap" id="cwrap">
        <div class="combo-trigger" id="ctrig" onclick="toggleDD()">
          <span class="combo-dot" id="cdot"></span>
          <span class="combo-lbl" id="clbl">All Topics</span>
          <svg class="combo-arr" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="combo-dd" id="cdd"></div>
      </div>

      <button class="review-btn" id="review-btn" onclick="startReview()" disabled title="Review wrongly answered questions">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Review
        <span class="rbadge" id="wrong-count-badge"></span>
      </button>

      <button class="rnd-btn" onclick="randomize()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
        </svg>
        Randomize
      </button>
    </div>
  </div>

  <div class="mode-banner" id="mode-banner">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span class="mode-banner-txt" id="mode-banner-txt"></span>
    <button class="mode-exit" onclick="exitReview()">✕ Exit review</button>
  </div>

  <div class="score-bar">
    <div class="sc"><div class="sc-num" id="sc-total">0</div><div class="sc-lbl">Total</div></div>
    <div class="sc"><div class="sc-num" id="sc-correct" style="color:#3dd68c">0</div><div class="sc-lbl">Correct</div></div>
    <div class="sc"><div class="sc-num" id="sc-wrong" style="color:#f87171">0</div><div class="sc-lbl">Wrong</div></div>
    <div class="sc"><div class="sc-num" id="sc-pct">—</div><div class="sc-lbl">Score %</div></div>
  </div>

  <div id="q-list" class="q-list"></div>
  <div class="submit-row" id="submit-row" style="display:none">
    <button class="submit-btn" onclick="submitAll()">Submit all &amp; see results</button>
  </div>
  <div id="result-screen" class="result-screen" style="display:none"></div>
</div>

<script>



const MASTER=[
  {topic:"Nuclear Envelope",q:"Which cells are exceptions to having a single nucleus, having many nuclei instead?",cs:["Mature red blood cells","Skeletal muscle cells","Liver cells","Neurons"],c:1,r:"Skeletal muscle cells have many nuclei, unlike most cells which have one. Mature red blood cells, in contrast, have none."},
  {topic:"Nuclear Envelope",q:"Which cells in the body have no nucleus at all?",cs:["Skeletal muscle cells","Mature red blood cells","Neurons","Liver cells"],c:1,r:"Mature red blood cells lack a nucleus entirely. This is unusual, since most cells contain a single nucleus."},
  {topic:"Nuclear Envelope",q:"The nucleus is enclosed by two membranes collectively called the:",cs:["Plasma membrane","Nuclear envelope","Golgi membrane","Mitochondrial membrane"],c:1,r:"The inner and outer membranes surrounding the nucleus together form the nuclear envelope. This double-membrane structure encloses the nuclear contents."},
  {topic:"Nuclear Envelope",q:"The outer nuclear membrane is continuous with which cytoplasmic structure?",cs:["The Golgi complex","The endoplasmic reticulum","Mitochondria","Lysosomes"],c:1,r:"The outer nuclear membrane is continuous with the endoplasmic reticulum in the cytoplasm. This links the nuclear envelope directly to the ER membrane system."},
  {topic:"Nuclear Envelope",q:"Structures that fuse the inner and outer nuclear membranes together, functioning like rivets, are called:",cs:["Nucleosomes","Nuclear pore complexes","Cristae","Spliceosomes"],c:1,r:"Nuclear pore complexes hold the inner and outer nuclear membranes together at various points. They act like rivets fusing the two membranes."},
  {topic:"Nuclear Envelope",q:"The central opening within a nuclear pore complex is called the:",cs:["Nucleolus","Nuclear pore","Cisterna","Intron"],c:1,r:"Each nuclear pore complex has a central opening called the nuclear pore. This opening is surrounded by interconnected rings and columns of proteins."},
  {topic:"Nuclear Envelope",q:"Movement of proteins and RNA through nuclear pores is:",cs:["A passive process requiring no energy","A selective, energy-requiring process using transport proteins","Completely random","Restricted only to small molecules"],c:1,r:"Unlike small molecules, which diffuse freely, protein and RNA movement through nuclear pores requires energy. Transport proteins ferry this cargo into and out of the nucleus."},
  {topic:"Nuclear Envelope",q:"Transport of specific proteins from the cytoplasm into the nucleus can serve to regulate gene expression in response to:",cs:["Temperature changes","Hormones","Osmotic pressure","Cell shape"],c:1,r:"Proteins transported into the nucleus can regulate gene expression, including in response to hormones. This links extracellular signals to nuclear gene activity."},
  {topic:"Nuclear Envelope",q:"The dark areas within the nucleus that are not surrounded by membranes and contain genes coding for ribosomal RNA are called:",cs:["Nucleosomes","Nucleoli","Cisternae","Chromatids"],c:1,r:"Nucleoli are dark, membrane-free regions of the nucleus. The DNA within them codes for ribosomal RNA production."},

  {topic:"Genome & Proteome",q:"The Human Genome Project published its findings on human DNA in which year?",cs:["1990","2001","2006","1953"],c:1,r:"Two versions of the human genome sequence were published in February 2001. One was published in Science and the other in Nature."},
  {topic:"Genome & Proteome",q:"According to the Human Genome Project, how similar is human DNA among different people?",cs:["50%","75%","99.9%","100%"],c:2,r:"Human DNA is 99.9% similar among individuals. Only about 0.1% accounts for human genetic variation."},
  {topic:"Genome & Proteome",q:"Approximately how many genes do humans have, according to genome sequencing results?",cs:["About 100,000","About 25,000","About 3 billion","About 60"],c:1,r:"Humans have approximately 25,000 genes, far fewer than the 100,000 previously believed. This was a major finding of the Human Genome Project."},
  {topic:"Genome & Proteome",q:"The term that refers to all of the proteins produced by the genome is:",cs:["Genotype","Proteome","Phenotype","Chromatin"],c:1,r:"The proteome refers to all proteins produced by an individual's or species' genome. It is much larger than the genome itself in terms of the number of distinct products."},
  {topic:"Genome & Proteome",q:"Approximately how many different proteins can a single human cell produce?",cs:["About 25,000","Well over 100,000","Exactly 300","About 60"],c:1,r:"A single cell can produce well over 100,000 different proteins. This greatly exceeds the roughly 25,000 genes in the genome."},
  {topic:"Genome & Proteome",q:"Which of the following is NOT listed as a mechanism allowing one gene to produce more than one protein?",cs:["Alternative splicing of RNA","Association of a polypeptide with different partner chains","Duplication of the entire chromosome","Posttranslational modifications like methylation and phosphorylation"],c:2,r:"Chromosome duplication is not a mechanism for generating protein diversity from one gene. Alternative splicing, altered chain associations, and posttranslational modification are the actual mechanisms described."},
  {topic:"Genome & Proteome",q:"On average, how many posttranslational modifications does a typical protein undergo?",cs:["None","At least two or three","Exactly ten","Over one hundred"],c:1,r:"An average protein undergoes at least two or three posttranslational modifications. These include changes such as methylation, phosphorylation, and cleavage."},
  {topic:"Genome & Proteome",q:"The function of a protein depends not only on its composition but also on its:",cs:["Molecular weight alone","Three-dimensional (tertiary) structure and interactions with other proteins","Color under a microscope","Location within the mitochondria only"],c:1,r:"Protein function depends on tertiary structure and interactions with other proteins, not composition alone. This adds complexity to studying the proteome."},
  {topic:"Genome & Proteome",q:"Different cell types, such as neurons versus liver cells, produce different sets of proteins because:",cs:["They have different genomes entirely","Different portions of the shared genome are active in each cell type","Only neurons contain DNA","Liver cells lack ribosomes"],c:1,r:"Although cells share the same genome, different portions of it are active depending on cell type. This selective gene activity underlies cellular specialization."},

  {topic:"Chromatin",q:"DNA is composed of nucleotide subunits containing which four nitrogenous bases?",cs:["Adenine, guanine, cytosine, thymine","Adenine, uracil, cytosine, thymine","Glucose, ribose, cytosine, guanine","Adenine, guanine, uracil, thymine"],c:0,r:"DNA nucleotides contain adenine, guanine, cytosine, and thymine. These bases pair to form the double helix structure."},
  {topic:"Chromatin",q:"The combination of DNA and protein that forms the threadlike material of chromosomes is called:",cs:["Ribosome","Chromatin","Cytoskeleton","Proteome"],c:1,r:"Chromatin is the combination of DNA with protein, primarily histones, within the nucleus. It makes up the threadlike material of chromosomes."},
  {topic:"Chromatin",q:"Histone proteins are described as:",cs:["Negatively charged, forming loose strands","Positively charged, organized into spools around which DNA is wound","Uncharged and inactive","Found only in the cytoplasm"],c:1,r:"Histones are positively charged proteins organized into spools. Negatively charged DNA strands wind around these spools."},
  {topic:"Chromatin",q:"Each nucleosome spool consists of how many base pairs of DNA wound around a histone core?",cs:["73","146","300","1,000"],c:1,r:"Each nucleosome consists of two turns of DNA, comprising 146 base pairs, wound around a histone core. This spooling forms the basic unit of chromatin packaging."},
  {topic:"Chromatin",q:"Chromatin that is relatively extended and active in genetic transcription is known as:",cs:["Heterochromatin","Euchromatin","A nucleosome","A spliceosome"],c:1,r:"Euchromatin is the extended, transcriptionally active form of chromatin. It contrasts with the condensed, inactive heterochromatin."},
  {topic:"Chromatin",q:"Heterochromatin is characterized by:",cs:["A relatively extended, active form","Being highly condensed with permanently inactivated genes","Containing only RNA","Being found solely in the cytoplasm"],c:1,r:"Heterochromatin is highly condensed and forms blotchy areas in the nucleus. The genes within it are permanently inactivated."},
  {topic:"Chromatin",q:"Acetylation of histone proteins has what effect on genetic transcription?",cs:["It turns on genetic transcription by creating a more open chromatin configuration","It permanently silences the gene","It has no effect on transcription","It destroys the DNA strand"],c:0,r:"Acetylation adds chemical groups to histones, producing a more open chromatin structure. This allows transcription factors to access and transcribe the DNA."},
  {topic:"Chromatin",q:"Deacetylation of histones has the opposite effect of acetylation, in that it:",cs:["Also activates transcription","Stops the gene from being transcribed","Converts DNA into RNA directly","Increases chromosome number"],c:1,r:"Deacetylation removes chemical groups added by acetylation, condensing the chromatin. This stops the associated gene from being transcribed."},
  {topic:"Chromatin",q:"Approximately how many of the roughly 25,000 human genes are active in any given differentiated cell?",cs:["About 25,000 (all of them)","About 300","Exactly 8","About 100,000"],c:1,r:"Only about 300 genes out of roughly 25,000 are active in any given cell. This reflects the cell's specialization through differentiation."},

  {topic:"Stem Cells",q:"Embryonic stem cells, which can become any cell type in the body, are described as:",cs:["Multipotent","Pluripotent","Differentiated","Senescent"],c:1,r:"Embryonic stem cells are pluripotent, meaning they can become any cell type in the body. This is in contrast to adult stem cells, which have more limited potential."},
  {topic:"Stem Cells",q:"Adult bone marrow stem cells that can form blood cells are called:",cs:["Mesenchymal stem cells","Hematopoietic stem cells","Neural stem cells","Pluripotent stem cells"],c:1,r:"Hematopoietic stem cells in bone marrow give rise to blood cells. They are distinct from mesenchymal stem cells, which form other tissue types."},
  {topic:"Stem Cells",q:"Mesenchymal stem cells in adult bone marrow can differentiate into which of the following?",cs:["Osteocytes, chondrocytes, and adipocytes","Only neurons","Only red blood cells","Only cardiac muscle cells"],c:0,r:"Mesenchymal stem cells can differentiate into osteocytes (bone), chondrocytes (cartilage), and adipocytes (fat). They provide a range of connective tissue cell types."},
  {topic:"Stem Cells",q:"Adult stem cells, unlike embryonic stem cells, are generally:",cs:["Pluripotent, able to become any cell type","Not normally pluripotent, but able to differentiate into a range of specific cell types","Completely unable to differentiate","Found only in the liver"],c:1,r:"Adult stem cells are not normally pluripotent but can still differentiate into a range of specific cell types. This distinguishes them from pluripotent embryonic stem cells."},
  {topic:"Stem Cells",q:"Neural stem cells identified in the adult nervous system are able to:",cs:["Migrate to specific locations and differentiate into neuron and glial cell types","Only remain stationary and inactive","Become red blood cells","Form mitochondria directly"],c:0,r:"Adult neural stem cells can migrate to particular locations in the nervous system. There they differentiate into specific neuron and glial cell types."},

  {topic:"RNA Synthesis",q:"The process by which DNA directs the synthesis of a complementary RNA molecule is called:",cs:["Genetic translation","Genetic transcription","Genetic replication","RNA interference"],c:1,r:"Genetic transcription is the process of DNA-directed RNA synthesis. It is the first stage of gene expression, followed by translation."},
  {topic:"RNA Synthesis",q:"The enzyme responsible for breaking hydrogen bonds between paired DNA bases during RNA synthesis is:",cs:["DNA polymerase","RNA polymerase","Catalase","Ligase"],c:1,r:"RNA polymerase breaks the hydrogen bonds between paired DNA bases in regions being transcribed. This allows RNA synthesis to proceed."},
  {topic:"RNA Synthesis",q:"Regions of DNA that regulatory molecules like hormones bind to in order to activate a gene are called:",cs:["Introns","Promoters","Exons","Nucleosomes"],c:1,r:"Promoter regions are where transcription factors, including hormones, bind to activate a gene. This binding initiates the transcription process."},
  {topic:"RNA Synthesis",q:"During RNA synthesis, complementary base pairing follows the rule that guanine bonds with cytosine and adenine bonds with:",cs:["Thymine","Uracil","Guanine","Adenine"],c:1,r:"In RNA, adenine bonds with uracil rather than thymine, since uracil replaces thymine in RNA. Guanine still pairs with cytosine as in DNA."},
  {topic:"RNA Synthesis",q:"Unlike DNA replication, RNA synthesis uses how many of the two freed DNA strands as a template?",cs:["Both strands equally","Only one of the two strands","Neither strand","A newly synthesized third strand"],c:1,r:"Only one of the two freed DNA strands serves as the template for RNA synthesis. This differs from DNA replication, which uses both strands."},
  {topic:"RNA Synthesis",q:"After an RNA molecule is produced during transcription, it:",cs:["Remains permanently attached to the DNA strand","Detaches from the DNA strand on which it was formed","Immediately becomes a protein","Destroys the DNA template"],c:1,r:"Once formed, an RNA molecule detaches from its DNA template strand. This allows the DNA to be transcribed repeatedly, producing many RNA copies."},
  {topic:"RNA Synthesis",q:"The human genome contains over how many base pairs?",cs:["3 million","3 billion","25,000","100,000"],c:1,r:"Human DNA contains over 3 billion base pairs. This is enough to code for millions of proteins, though far fewer are actually produced."},
  {topic:"RNA Synthesis",q:"Approximately how many different proteins does the average human cell contain?",cs:["25,000 to 60,000","30,000 to 150,000","3 million","Exactly 300"],c:1,r:"The average human cell contains roughly 30,000 to 150,000 different proteins. This is far fewer than the theoretical coding capacity of the genome."},

  {topic:"Types of RNA",q:"Which type of RNA contains the code for the synthesis of specific proteins?",cs:["Transfer RNA (tRNA)","Messenger RNA (mRNA)","Ribosomal RNA (rRNA)","Precursor RNA only"],c:1,r:"Messenger RNA (mRNA) carries the code for protein synthesis. It is produced from precursor mRNA through processing in the nucleus."},
  {topic:"Types of RNA",q:"Which type of RNA is needed to decode the genetic message contained in mRNA?",cs:["Ribosomal RNA (rRNA)","Transfer RNA (tRNA)","Precursor mRNA","Small nuclear RNA"],c:1,r:"Transfer RNA (tRNA) decodes the genetic message in mRNA during translation. It matches codons to specific amino acids."},
  {topic:"Types of RNA",q:"Which type of RNA forms part of the structure of ribosomes?",cs:["mRNA","tRNA","Ribosomal RNA (rRNA)","Precursor mRNA"],c:2,r:"Ribosomal RNA (rRNA) forms part of ribosome structure. The DNA coding for rRNA is located in the nucleolus."},
  {topic:"Types of RNA",q:"The RNA type that must be altered within the nucleus before becoming functional mRNA is:",cs:["Ribosomal RNA","Precursor messenger RNA (pre-mRNA)","Transfer RNA","Small interfering RNA"],c:1,r:"Precursor mRNA (pre-mRNA) must be processed and altered within the nucleus. Only after this modification can it become functional mRNA."},
  {topic:"Types of RNA",q:"The DNA that codes for rRNA synthesis is located specifically in the:",cs:["Nucleolus","Mitochondria","Golgi complex","Ribosome itself"],c:0,r:"The DNA coding for rRNA synthesis is located in the nucleolus. This is distinct from the DNA coding for pre-mRNA and tRNA, found elsewhere in the nucleus."},
  {topic:"Types of RNA",q:"In bacteria, mRNA begins directing protein synthesis:",cs:["Only after extensive nuclear processing","As soon as it is transcribed","Only after 24 hours","Never; bacteria don't use mRNA"],c:1,r:"In bacteria, mRNA can direct protein synthesis immediately upon transcription. This differs from higher organisms, where pre-mRNA must first be processed."},
  {topic:"Types of RNA",q:"In higher organisms such as humans, before pre-mRNA can direct protein synthesis, it must:",cs:["Be modified within the nucleus before entering the cytoplasm as mRNA","Be transported directly into mitochondria","Be converted into DNA","Bind directly to histones"],c:0,r:"Pre-mRNA in higher organisms must be modified within the nucleus. Only after this processing can it enter the cytoplasm as functional mRNA."},
  {topic:"Types of RNA",q:"The large size of pre-mRNA compared to mature mRNA is due to:",cs:["Excess bases only at the very ends of the molecule","Excess bases (introns) located within the molecule","Extra ribosomes attached to it","Additional protein content"],c:1,r:"Pre-mRNA's larger size comes from noncoding regions, or introns, located within the molecule rather than at the ends. These must be removed to form mature mRNA."},

  {topic:"RNA Splicing",q:"Noncoding regions of base pairs within a gene that do not contribute to the final protein code are called:",cs:["Exons","Introns","Promoters","Nucleosomes"],c:1,r:"Introns are noncoding regions within a gene that interrupt the coding sequence. They must be removed before mature mRNA is formed."},
  {topic:"RNA Splicing",q:"The coding regions of a gene that are retained and spliced together in mature mRNA are called:",cs:["Introns","Exons","Nucleosomes","Promoters"],c:1,r:"Exons are the coding regions of a gene, spliced together to form mature mRNA. Introns, in contrast, are removed during processing."},
  {topic:"RNA Splicing",q:"On average, individual human genes code for how many different proteins due to alternative splicing?",cs:["Exactly one","About three","About twenty-five","About one thousand"],c:1,r:"Individual genes code for an average of three different proteins. This is largely achieved through alternative splicing of exons."},
  {topic:"RNA Splicing",q:"The average human gene contains how many exons?",cs:["About eight","Exactly one","About 234","About 25,000"],c:0,r:"The average gene contains about eight exons, though this varies widely. The titin gene, for example, contains 234 exons."},
  {topic:"RNA Splicing",q:"Which gene is noted as containing an unusually large number of exons (234)?",cs:["Titin","Insulin","Hemoglobin","Actin"],c:0,r:"The gene for the protein titin contains 234 exons, far more than the average gene. This allows extensive potential for alternative splicing."},
  {topic:"RNA Splicing",q:"Approximately what percentage of genes involved in cell signaling and regulation display alternative splicing?",cs:["About 10%","About 25%","About 75%","100%"],c:2,r:"About 75% of genes involved in cell signaling and regulation undergo alternative splicing. This reflects the importance of splicing variation in regulatory processes."},
  {topic:"RNA Splicing",q:"The macromolecules that cut introns out of pre-mRNA and splice exons together are called:",cs:["Histones","snRNPs (small nuclear ribonucleoproteins)","Ribosomes","Kinesins"],c:1,r:"snRNPs, or \"snurps,\" are small nuclear ribonucleoproteins that carry out splicing. They are ribosome-like aggregates of RNA and protein."},
  {topic:"RNA Splicing",q:"The body formed by snRNPs that splices exons together is called the:",cs:["Spliceosome","Nucleosome","Ribosome","RISC"],c:0,r:"snRNPs form a body called the spliceosome, which splices exons together. This produces the functional mRNA that leaves the nucleus."},
  {topic:"RNA Splicing",q:"Approximately what percentage of human DNA actually codes for proteins?",cs:["Less than 2%","About 50%","About 75%","100%"],c:0,r:"Less than 2% of human DNA codes for proteins. Evidence suggests that much of the remaining DNA, once considered \"junk,\" may have regulatory functions."},

  {topic:"RNA Interference",q:"The 2006 Nobel Prize in Physiology or Medicine was awarded for the discovery of:",cs:["The Human Genome Project","RNA interference (RNAi)","DNA replication","The Golgi complex"],c:1,r:"RNA interference (RNAi) was recognized with the 2006 Nobel Prize in Physiology or Medicine. It describes how certain RNA molecules regulate gene expression."},
  {topic:"RNA Interference",q:"RNA interference is a regulatory process in which certain RNA molecules:",cs:["Always code for new proteins","Prevent specific mRNA molecules from being expressed (translated)","Replace DNA in the nucleus","Form the structure of mitochondria"],c:1,r:"RNAi involves RNA molecules that prevent specific mRNAs from being translated. These regulatory RNAs do not themselves code for proteins."},
  {topic:"RNA Interference",q:"Short RNA molecules 21 to 28 nucleotides long, processed from double-stranded RNA that leaves the nucleus, are called:",cs:["Short interfering RNA (siRNA)","MicroRNA (miRNA)","Transfer RNA (tRNA)","Ribosomal RNA (rRNA)"],c:0,r:"siRNA is derived from double-stranded RNA processed in the cytoplasm into short 21-28 nucleotide fragments. It is one of the two main mediators of RNA interference."},
  {topic:"RNA Interference",q:"MicroRNA (miRNA) is initially formed from single-stranded RNA that:",cs:["Forms a hairpin loop by imperfect base pairing","Is identical in structure to tRNA","Never leaves the nucleus","Is exactly 500 nucleotides long"],c:0,r:"miRNA arises from short single-stranded RNA that folds into a hairpin loop via imperfect base pairing. This precursor is then processed into mature miRNA."},
  {topic:"RNA Interference",q:"Both siRNA and miRNA enter a protein particle called the:",cs:["Spliceosome","RNA-induced silencing complex (RISC)","Ribosome","Nucleosome"],c:1,r:"Both siRNA and miRNA enter the RNA-induced silencing complex (RISC). Within RISC, they are converted to single-stranded forms for targeting mRNA."},
  {topic:"RNA Interference",q:"When an siRNA is perfectly complementary to a target mRNA, the result is typically:",cs:["No effect on the mRNA","Destruction of the mRNA, preventing translation","Increased translation of the mRNA","Conversion of the mRNA into DNA"],c:1,r:"Perfect complementarity between siRNA and mRNA leads to destruction of the mRNA via RISC. This effectively silences that specific mRNA."},
  {topic:"RNA Interference",q:"Most miRNA, which are not perfectly complementary to their target mRNA, act by:",cs:["Destroying the mRNA completely","Preventing the mRNA from being translated into protein without necessarily destroying it","Converting the mRNA into a different protein","Increasing DNA replication"],c:1,r:"Since most miRNA are only partially complementary to their targets, they block translation rather than destroy the mRNA. This is a subtler form of gene silencing than siRNA-mediated destruction."},
  {topic:"RNA Interference",q:"A single miRNA can be incompletely complementary to multiple mRNAs, potentially silencing as many as:",cs:["1 mRNA","10 mRNAs","200 different mRNA molecules","3 billion mRNAs"],c:2,r:"Because one miRNA can be partially complementary to many different mRNAs, it may silence as many as an estimated 200 different mRNA molecules. This gives miRNA broad regulatory reach."},
  {topic:"RNA Interference",q:"Research has shown that, compared to normal cells, tumor cells tend to produce:",cs:["More miRNA molecules than normal cells","Fewer miRNA molecules than normal cells","Exactly the same amount of miRNA as normal cells","No RNA at all"],c:1,r:"Tumor cells have been found to produce fewer miRNA molecules than normal cells. The patterns of miRNA types produced may also help characterize tumor type for diagnosis."},
];

const TOPIC_COLORS={
  "All Topics":{dot:"#3dd68c"},
  "Nuclear Envelope":{dot:"#818cf8"},
  "Genome & Proteome":{dot:"#f59e0b"},
  "Chromatin":{dot:"#34d399"},
  "Stem Cells":{dot:"#f472b6"},
  "RNA Synthesis":{dot:"#38bdf8"},
  "Types of RNA":{dot:"#a78bfa"},
  "RNA Splicing":{dot:"#fb7185"},
  "RNA Interference":{dot:"#facc15"},
};

const ALL_TOPICS=["All Topics",...new Set(MASTER.map(q=>q.topic))];

let selTopic="All Topics";
let ddOpen=false;
let quizItems=[];
let userAnswers={};
let checkedItems={};
let isReviewMode=false;
let wrongLog={};

const LABELS=['A','B','C','D'];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function buildItems(pool,doShuffle,forReview=false){
  const src=doShuffle?shuffle([...pool]):[...pool];
  return src.map((q,i)=>{
    const indexed=q.cs.map((t,idx)=>({t,ok:idx===q.c}));
    shuffle(indexed);
    return{
      id:forReview?q.origId:i,
      origId:forReview?q.origId:i,
      topic:q.topic,q:q.q,
      choices:indexed.map(x=>x.t),
      correct:indexed.findIndex(x=>x.ok),
      reason:q.r,
      prevWrongChoice:forReview?q.prevWrongChoice:null,
      prevWrongText:forReview?q.prevWrongText:null,
    };
  });
}

function getPool(){return selTopic==="All Topics"?MASTER:MASTER.filter(q=>q.topic===selTopic)}

function buildDropdown(){
  const dd=document.getElementById('cdd');
  dd.innerHTML='';
  ALL_TOPICS.forEach(t=>{
    const cnt=t==="All Topics"?MASTER.length:MASTER.filter(q=>q.topic===t).length;
    const col=TOPIC_COLORS[t]||{dot:"#64748b"};
    const el=document.createElement('div');
    el.className='combo-opt'+(t===selTopic?' sel':'');
    el.innerHTML=`<span class="opt-dot" style="background:${col.dot}"></span><span>${t}</span><span class="opt-cnt">${cnt}</span>`;
    el.onclick=()=>pickTopic(t);
    dd.appendChild(el);
  });
}

function toggleDD(){ddOpen=!ddOpen;document.getElementById('cdd').classList.toggle('open',ddOpen);document.getElementById('ctrig').classList.toggle('open',ddOpen)}
function closeDD(){ddOpen=false;document.getElementById('cdd').classList.remove('open');document.getElementById('ctrig').classList.remove('open')}
function pickTopic(t){
  selTopic=t;
  const col=TOPIC_COLORS[t]||{dot:"#64748b"};
  document.getElementById('clbl').textContent=t;
  document.getElementById('cdot').style.background=col.dot;
  buildDropdown();closeDD();
  exitReviewSilent();
  applyFilter(false);
}
document.addEventListener('click',e=>{if(!document.getElementById('cwrap').contains(e.target))closeDD()});

function applyFilter(doShuffle){
  isReviewMode=false;
  quizItems=buildItems(getPool(),doShuffle);
  userAnswers={};checkedItems={};
  renderList();
  document.getElementById('result-screen').style.display='none';
  document.getElementById('q-list').style.display='flex';
  document.getElementById('submit-row').style.display='flex';
  document.getElementById('mode-banner').classList.remove('show');
  document.getElementById('rbadge').classList.remove('on');
  updateScore();
  updateReviewBtn();
}

function randomize(){
  const svg=document.querySelector('.rnd-btn svg');
  svg.style.transform='rotate(360deg)';
  setTimeout(()=>svg.style.transform='',500);
  document.getElementById('sbadge').classList.add('on');
  exitReviewSilent();
  applyFilter(true);
}

function updateReviewBtn(){
  const wrongKeys=Object.keys(wrongLog);
  const btn=document.getElementById('review-btn');
  const badge=document.getElementById('wrong-count-badge');
  if(wrongKeys.length>0){
    btn.disabled=false;
    badge.textContent=wrongKeys.length;
    badge.classList.add('show');
  } else {
    btn.disabled=true;
    badge.classList.remove('show');
  }
}

function startReview(){
  if(Object.keys(wrongLog).length===0)return;
  isReviewMode=true;
  document.getElementById('sbadge').classList.remove('on');
  document.getElementById('rbadge').classList.add('on');

  const reviewPool=Object.values(wrongLog).map(w=>({
    origId:w.origId,
    topic:w.topic,
    q:w.q,
    cs:w.choices,
    c:w.correctIdx,
    r:w.reason,
    prevWrongChoice:w.userAnswerIdx,
    prevWrongText:w.userAnswerText,
  }));

  quizItems=buildItems(reviewPool,false,true);
  userAnswers={};checkedItems={};

  const banner=document.getElementById('mode-banner');
  document.getElementById('mode-banner-txt').textContent=`Review mode — ${quizItems.length} wrongly answered question${quizItems.length>1?'s':''} from your last attempt. Try them again!`;
  banner.classList.add('show');

  document.getElementById('result-screen').style.display='none';
  document.getElementById('q-list').style.display='flex';
  document.getElementById('submit-row').style.display='flex';
  renderList(true);
  updateScore();
}

function exitReview(){
  exitReviewSilent();
  applyFilter(false);
}
function exitReviewSilent(){
  isReviewMode=false;
  document.getElementById('rbadge').classList.remove('on');
  document.getElementById('mode-banner').classList.remove('show');
}

function renderList(isReview=false){
  const list=document.getElementById('q-list');
  list.innerHTML='';
  quizItems.forEach((q,i)=>{
    const col=TOPIC_COLORS[q.topic]||{dot:"#60a5fa"};
    const card=document.createElement('div');
    card.className='q-card'+(isReview?' review-card':'');
    card.id='qcard-'+i;

    const opts=q.choices.map((ch,ci)=>`<option value="${ci}">${LABELS[ci]}. ${ch}</option>`).join('');
    const prevHtml=isReview&&q.prevWrongText
      ?`<div class="prev-answer-row show">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span style="color:#64748b">Previous wrong answer:</span>
          <span class="prev-wrong-chip">${q.prevWrongText}</span>
        </div>`
      :'';

    card.innerHTML=`
      <div class="q-meta">
        <span class="q-idx">${isReview?'Review':'Q'}${i+1}${isReview?' of '+quizItems.length:' of '+quizItems.length}</span>
        <span class="q-topic-pill" style="color:${col.dot};border-color:${col.dot}44">${q.topic}</span>
        ${isReview?'<span class="wrong-pill">Previously wrong</span>':''}
      </div>
      ${prevHtml}
      <div class="q-text">${q.q}</div>
      <div class="q-row">
        <div class="q-select-wrap">
          <select class="q-select" id="sel-${i}" onchange="onSelect(${i},this.value)">
            <option value="" disabled selected style="color:#64748b">— Select an answer —</option>
            ${opts}
          </select>
          <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <button class="check-btn" id="chk-${i}" onclick="checkOne(${i})" disabled>Check</button>
      </div>
      <div class="q-result" id="res-${i}">
        <div class="result-icon" id="res-icon-${i}"></div>
        <span class="result-txt" id="res-txt-${i}"></span>
      </div>
      <div class="result-reason" id="reason-${i}">${q.reason}</div>
    `;
    list.appendChild(card);
  });
}

function onSelect(i,val){
  userAnswers[i]=parseInt(val);
  const btn=document.getElementById('chk-'+i);
  if(!checkedItems[i])btn.disabled=false;
}

function checkOne(i){
  if(userAnswers[i]===undefined||checkedItems[i])return;
  checkedItems[i]=true;
  const q=quizItems[i];
  const correct=userAnswers[i]===q.correct;
  const card=document.getElementById('qcard-'+i);
  const resEl=document.getElementById('res-'+i);
  const icon=document.getElementById('res-icon-'+i);
  const txt=document.getElementById('res-txt-'+i);
  const reason=document.getElementById('reason-'+i);
  const sel=document.getElementById('sel-'+i);
  const btn=document.getElementById('chk-'+i);

  sel.disabled=true;
  btn.disabled=true;
  btn.textContent=correct?'✓':'✗';
  btn.style.background=correct?'#1a4731':'#2b0d0d';
  btn.style.color=correct?'#3dd68c':'#f87171';
  btn.style.borderColor=correct?'#3dd68c55':'#f8717155';

  card.classList.remove('review-card');
  card.classList.add(correct?'answered-correct':'answered-wrong');
  resEl.className='q-result show '+(correct?'result-correct':'result-wrong');
  icon.textContent=correct?'✓':'✗';
  txt.textContent=correct
    ?'Correct! '+LABELS[q.correct]+' is right.'
    :`Wrong. Correct answer: ${LABELS[q.correct]}. ${q.choices[q.correct]}`;
  reason.classList.add('show');

  const masterKey=isReviewMode?q.origId:i;
  if(!correct){
    wrongLog[masterKey]={
      origId:masterKey,
      topic:q.topic,q:q.q,
      choices:q.choices,
      correctIdx:q.correct,
      reason:q.reason,
      userAnswerIdx:userAnswers[i],
      userAnswerText:LABELS[userAnswers[i]]+'. '+q.choices[userAnswers[i]],
    };
  } else {
    delete wrongLog[masterKey];
  }

  updateScore();
  updateReviewBtn();
}

function updateScore(){
  const total=Object.keys(checkedItems).length;
  const cor=Object.keys(checkedItems).filter(i=>userAnswers[i]===quizItems[i].correct).length;
  const wrg=total-cor;
  const pct=total>0?Math.round((cor/total)*100)+'%':'—';
  document.getElementById('sc-total').textContent=quizItems.length;
  document.getElementById('sc-correct').textContent=cor;
  document.getElementById('sc-wrong').textContent=wrg;
  document.getElementById('sc-pct').textContent=pct;
}

function submitAll(){
  quizItems.forEach((_,i)=>{
    if(!checkedItems[i]&&userAnswers[i]!==undefined)checkOne(i);
  });
  const unanswered=quizItems.filter((_,i)=>userAnswers[i]===undefined&&!checkedItems[i]);
  if(unanswered.length>0){
    const el=document.getElementById('qcard-'+unanswered[0].id);
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  showResult();
}

function showResult(){
  document.getElementById('q-list').style.display='none';
  document.getElementById('submit-row').style.display='none';
  document.getElementById('mode-banner').classList.remove('show');
  const rs=document.getElementById('result-screen');
  rs.style.display='block';
  const total=quizItems.length;
  const cor=Object.keys(checkedItems).filter(i=>userAnswers[i]===quizItems[i].correct).length;
  const wrong=total-cor;
  const pct=total>0?Math.round((cor/total)*100):0;
  const grade=pct>=90?'Excellent! 🎉':pct>=75?'Good work! 👍':pct>=60?'Keep studying! 📖':'Needs more review 💪';
  const dots=quizItems.map((_,i)=>{
    const ok=userAnswers[i]===quizItems[i].correct;
    return`<span class="q-dot" style="background:${checkedItems[i]?(ok?'#3dd68c':'#f87171'):'#2a3244'}" title="Q${i+1}: ${checkedItems[i]?(ok?'Correct':'Wrong'):'Unanswered'}"></span>`;
  }).join('');

  const hasWrong=Object.keys(wrongLog).length>0;

  rs.innerHTML=`
    <div class="result-score">${cor}/${total}</div>
    <div class="result-label">${pct}% — ${grade}</div>
    <div class="res-breakdown">
      <div class="sc"><div class="sc-num" style="color:#3dd68c">${cor}</div><div class="sc-lbl">Correct</div></div>
      <div class="sc"><div class="sc-num" style="color:#f87171">${wrong}</div><div class="sc-lbl">Wrong</div></div>
      <div class="sc"><div class="sc-num" style="color:#f59e0b">${Object.keys(wrongLog).length}</div><div class="sc-lbl">To review</div></div>
    </div>
    <div class="indicators">${dots}</div>
    <div class="res-btns">
      <button class="res-btn" onclick="restart()" style="background:#161b27;color:#cbd5e1;border:0.5px solid #2a3244">↺ Restart</button>
      ${hasWrong?`<button class="res-btn" onclick="startReviewFromResult()" style="background:#2b1a0d;color:#f59e0b;border:0.5px solid #f59e0b55">⚑ Review ${Object.keys(wrongLog).length} wrong</button>`:''}
      <button class="res-btn" onclick="randomize()" style="background:#1a2a40;color:#60a5fa;border:0.5px solid #3a6ea8">🔀 Randomize</button>
    </div>`;
}

function startReviewFromResult(){
  document.getElementById('result-screen').style.display='none';
  startReview();
}

function restart(){
  wrongLog={};
  userAnswers={};checkedItems={};
  isReviewMode=false;
  quizItems=buildItems(getPool(),false);
  renderList();
  document.getElementById('result-screen').style.display='none';
  document.getElementById('q-list').style.display='flex';
  document.getElementById('submit-row').style.display='flex';
  document.getElementById('sbadge').classList.remove('on');
  document.getElementById('rbadge').classList.remove('on');
  document.getElementById('mode-banner').classList.remove('show');
  updateScore();
  updateReviewBtn();
}

buildDropdown();
document.getElementById('cdot').style.background=TOPIC_COLORS["All Topics"].dot;
applyFilter(false);
</script>
