
<style>

.ctrl{display:flex;align-items:center;justify-content:space-between;background:#161b27;border:0.5px solid #2a3244;border-radius:10px;padding:.7rem 1rem;margin-bottom:1.25rem;gap:8px;flex-wrap:wrap}

.review-btn .rbadge{position:absolute;top:-7px;right:-7px;background:#f59e0b;color:#0f1117;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;display:none}

.combo-trigger:hover{border-color:#3a4a6b;color:#cbd5e1}

.check-btn:hover{background:#1f5a3d}

.q-result{display:none;align-items:center;gap:6px;font-size:12px;margin-top:.6rem}

.result-correct .result-txt{color:#3dd68c;font-size:16px}

.result-reason{font-size:20px;color:#C8FF97;margin-top:.45rem;padding:.55rem .75rem;background:#0d1f2b;border-left:2px solid #3dd68c44;border-radius:0 6px 6px 0;display:none}
.result-reason.show{display:block}

.prev-answer-row{display:none;align-items:center;gap:6px;margin-bottom:.55rem;font-size:13px;color:#64748b}

.submit-row{margin-top:1.5rem;display:flex;justify-content:center}
.submit-btn{padding:.65rem 2rem;background:#1a4731;border:0.5px solid #3dd68c55;border-radius:10px;color:#3dd68c;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.submit-btn:hover{background:#1f5a3d}

.result-screen{text-align:center;padding:2rem 0}
.result-score{font-size:52px;font-weight:500;color:#3dd68c}
.result-label{font-size:17px;color:#64748b;margin:.5rem 0 1.5rem}
.res-breakdown{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:1.5rem}
.indicators{margin-bottom:1.5rem;line-height:2}
.q-dot{display:inline-block;width:16px;height:16px;border-radius:50%;margin:2px;cursor:default}
.res-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.res-btn{padding:.6rem 1.3rem;border-radius:10px;font-size:13px;cursor:pointer}
</style>

<script>



const MASTER=[
  {topic:"Cell Basics",q:"For descriptive purposes, a cell is divided into which three principal parts?",cs:["Nucleus, mitochondria, ribosomes","Plasma membrane, cytoplasm/organelles, nucleus","Cytosol, Golgi complex, lysosome","Membrane, cilia, flagella"],c:1,r:"The cell is divided into the plasma membrane, cytoplasm and organelles, and the nucleus. Each part has distinct roles in cell structure and function."},
  {topic:"Cell Basics",q:"Cytosol refers to:",cs:["The entire cytoplasm including organelles","The fluid portion of cytoplasm that cannot be removed by centrifugation","The membrane surrounding the nucleus","A type of organelle"],c:1,r:"Cytosol is the fluid part of the cytoplasm remaining after organelles are removed. It cannot be separated out by centrifugation."},
  {topic:"Cell Basics",q:"Nucleoli are centers for the production of:",cs:["Lysosomes","DNA","Ribosomes","Mitochondria"],c:2,r:"Nucleoli produce ribosomes, which are the sites of protein synthesis. They are found within the nucleus."},
  {topic:"Cell Basics",q:"What is the largest organelle in a cell?",cs:["Golgi complex","Lysosome","Mitochondrion","Nucleus"],c:3,r:"The nucleus is the largest organelle and contains the cell's DNA. It directs the cell's activities."},
  {topic:"Cell Basics",q:"Organelles are located:",cs:["Only inside the nucleus","Within the cytoplasm, outside the nucleus","Outside the plasma membrane","In the extracellular matrix"],c:1,r:"Organelles (excluding the nucleus) are subcellular structures within the cytoplasm. They perform specific cellular functions."},

  {topic:"Membrane Structure",q:"The plasma membrane is composed primarily of:",cs:["Carbohydrates and water","Phospholipids and proteins","DNA and RNA","Cellulose and lignin"],c:1,r:"The plasma membrane, like other cellular membranes, is composed primarily of phospholipids and proteins. Carbohydrates are also present but in smaller amounts."},
  {topic:"Membrane Structure",q:"In a phospholipid, the hydrophilic region is due to the presence of:",cs:["A fatty acid chain","A phosphate group","A carbohydrate ring","A steroid nucleus"],c:1,r:"The phosphate-containing region of a phospholipid is polar and hydrophilic. The rest of the molecule is nonpolar and hydrophobic."},
  {topic:"Membrane Structure",q:"Why do phospholipids form a bilayer in the membrane?",cs:["Hydrophobic tails huddle together in the center, away from water","Hydrophilic heads repel each other","Proteins force them into two layers","Phospholipids are charged ions"],c:0,r:"Because both sides of the membrane are aqueous, hydrophobic tails cluster in the middle. Polar heads stay exposed to water on both surfaces."},
  {topic:"Membrane Structure",q:"Integral membrane proteins differ from peripheral proteins in that they:",cs:["Are only found on the outer surface","Span the membrane from one side to the other","Are not made of protein","Cannot move laterally"],c:1,r:"Integral proteins span the entire membrane, while peripheral proteins are only partially embedded on one face. Both types can move within the fluid membrane."},
  {topic:"Membrane Structure",q:"The fluid-mosaic model describes the plasma membrane as:",cs:["A rigid, solid structure","A membrane with proteins fixed in permanent positions","A fluid phospholipid layer with mobile proteins forming a changing pattern","A single layer of protein"],c:2,r:"Phospholipids and proteins are free to move laterally, creating a constantly changing mosaic. This is the basis of the fluid-mosaic model."},
  {topic:"Membrane Structure",q:"Why is the fluid-mosaic model considered somewhat misleading?",cs:["Membranes are not fluid at all","Proteins are distributed patchily rather than uniformly","Phospholipids don't actually move","There are no proteins in real membranes"],c:1,r:"Membrane proteins are localized by function, so they are patchy rather than uniformly distributed. Some regions are much more crowded with protein than the model implies."},
  {topic:"Membrane Structure",q:"Receptor proteins in the plasma membrane are typically:",cs:["Nonspecific and bind any molecule","Specific for one particular messenger, similar to enzyme-substrate specificity","Only found in muscle cells","Made entirely of carbohydrate"],c:1,r:"Receptor proteins are usually specific for a single regulatory molecule. This specificity resembles that of an enzyme for its substrate."},
  {topic:"Membrane Structure",q:"Membrane proteins that identify the tissue type of an individual are called:",cs:["Enzymes","Antigens (markers)","Phospholipids","Integrins"],c:1,r:"Some membrane proteins act as antigens, or markers, that identify tissue type. These are distinct from receptor or transport proteins."},
  {topic:"Membrane Structure",q:"Carbohydrates in the plasma membrane are primarily found:",cs:["Attached to the outer surface as glycoproteins and glycolipids","In the hydrophobic core of the membrane","Only inside the cell","Attached to the inner surface facing the cytoplasm"],c:0,r:"Membrane carbohydrates are mainly attached to the outer surface as glycoproteins and glycolipids. They are not embedded in the membrane's hydrophobic core."},
  {topic:"Membrane Structure",q:"Blood type is determined by:",cs:["Integral proteins alone","Specific glycolipids on the red blood cell plasma membrane","The nucleus of the red blood cell","Cilia on red blood cells"],c:1,r:"Certain glycolipids on the red blood cell membrane act as antigens that determine blood type. These are carbohydrate-containing membrane components."},
  {topic:"Membrane Structure",q:"What happens when carbohydrates are stripped from the outer surface of red blood cells?",cs:["The cells become more resistant to destruction","The cells are destroyed more rapidly by the liver, spleen, and bone marrow","The cells change blood type","Nothing changes"],c:1,r:"Stripped red blood cells are destroyed more quickly by the liver, spleen, and bone marrow. This shows carbohydrates help protect cells from premature destruction."},

  {topic:"Phagocytosis",q:"Which cells perform amoeboid movement and phagocytosis to protect the body from microorganisms?",cs:["Red blood cells and platelets","Neutrophils and macrophages","Nerve cells and glial cells","Sperm cells and oocytes"],c:1,r:"Neutrophils and macrophages are phagocytic cells capable of amoeboid movement. They engulf bacteria and debris to protect the body."},
  {topic:"Phagocytosis",q:"Pseudopods are:",cs:["Rigid spikes on the cell surface","Extensions of cytoplasm used for movement and engulfing particles","Folds of the nuclear membrane","A type of cilia"],c:1,r:"Pseudopods (\"false feet\") are cytoplasmic extensions that pull the cell along and surround particles. They are central to amoeboid movement and phagocytosis."},
  {topic:"Phagocytosis",q:"Amoeboid movement depends on the bonding of which membrane proteins to the extracellular matrix?",cs:["Integrins","Cadherins","Aquaporins","Glycolipids"],c:0,r:"Integrins span the plasma membrane and bind proteins in the extracellular matrix. This bonding allows amoeboid movement to occur."},
  {topic:"Phagocytosis",q:"After a phagocyte engulfs a particle, the particle is contained in a structure called a:",cs:["Ribosome","Food vacuole","Nucleolus","Peroxisome"],c:1,r:"The engulfed particle becomes enclosed in a food vacuole. This vacuole later fuses with a lysosome for digestion."},
  {topic:"Phagocytosis",q:"Phagocytes recognize dying cells largely through an \"eat me\" signal called:",cs:["Cholesterol","Phosphatidylserine","Glycogen","Hemoglobin"],c:1,r:"Phosphatidylserine exposed on the surface of dying cells signals phagocytes to engulf them. This is key to clearing apoptotic cells."},
  {topic:"Phagocytosis",q:"Unlike phagocytosis for infection, apoptosis (cell suicide) is:",cs:["Always accompanied by inflammation","A normal ongoing process not accompanied by inflammation","A rare, abnormal event","Performed only by red blood cells"],c:1,r:"Apoptosis is a normal, ongoing process in the body. It is not accompanied by inflammation, unlike phagocytosis triggered by infection."},

  {topic:"Endocytosis",q:"Pinocytosis is best described as:",cs:["A specific process requiring receptor binding","A nonspecific process in which cells engulf extracellular fluid and dissolved molecules","The release of secretory products from a cell","A process unique to sperm cells"],c:1,r:"Pinocytosis is a nonspecific form of endocytosis performed by many cells. It allows the cell to engulf extracellular fluid and large dissolved molecules such as proteins."},
  {topic:"Endocytosis",q:"What distinguishes receptor-mediated endocytosis from pinocytosis?",cs:["It does not involve the plasma membrane","It requires binding of specific extracellular molecules to specific membrane receptor proteins","It only occurs in phagocytic cells","It results in exocytosis instead"],c:1,r:"Receptor-mediated endocytosis requires specific extracellular molecules to bind specific receptor proteins. This triggers invagination, fusion, and vesicle formation."},
  {topic:"Endocytosis",q:"Uptake of cholesterol-carrying proteins into artery cells by receptor-mediated endocytosis contributes to:",cs:["Atherosclerosis","Osteoporosis","Anemia","Hepatitis"],c:0,r:"Cholesterol attached to specific proteins is taken up by artery cells via receptor-mediated endocytosis. This process is partly responsible for atherosclerosis."},
  {topic:"Endocytosis",q:"Which of these exploit receptor-mediated endocytosis to invade cells?",cs:["Bacteria only","Hepatitis, polio, and AIDS viruses","Only fungi","Prions exclusively"],c:1,r:"Hepatitis, polio, and AIDS viruses use receptor-mediated endocytosis to enter cells. This hijacks a normal cellular uptake pathway."},
  {topic:"Endocytosis",q:"During endocytosis, the plasma membrane:",cs:["Extends outward with pseudopods","Furrows inward (invaginates)","Remains completely flat","Dissolves entirely"],c:1,r:"Endocytosis involves the plasma membrane furrowing inward rather than extending outward. This contrasts with the outward pseudopod extension seen in phagocytosis."},

  {topic:"Exocytosis",q:"Which organelle packages secretory proteins into vesicles before exocytosis?",cs:["Mitochondrion","Golgi complex","Lysosome","Nucleolus"],c:1,r:"The Golgi complex packages proteins destined for export into secretory vesicles. These vesicles later fuse with the plasma membrane during exocytosis."},
  {topic:"Exocytosis",q:"Exocytosis at nerve endings is used to release:",cs:["Hormones only","Chemical neurotransmitters","Digestive enzymes only","Waste products only"],c:1,r:"Nerve endings release neurotransmitters into the synapse via exocytosis. Secretory vesicles fuse with the plasma membrane to release their contents."},
  {topic:"Exocytosis",q:"What effect does exocytosis have on the total surface area of the plasma membrane?",cs:["It decreases surface area","It increases surface area, replacing membrane lost during endocytosis","It has no effect on surface area","It destroys the plasma membrane"],c:1,r:"When secretory vesicles fuse with the plasma membrane, total surface area increases. This replaces membrane material lost during endocytosis."},

  {topic:"Cilia & Flagella",q:"In the respiratory system, motile cilia function to:",cs:["Produce mucus","Transport strands of mucus toward the pharynx","Absorb nutrients","Destroy pathogens directly"],c:1,r:"Cilia lining the respiratory airways beat in unison to move mucus toward the pharynx. The mucus can then be swallowed or expectorated."},
  {topic:"Cilia & Flagella",q:"In the female reproductive tract, ciliated epithelial cells in the uterine tube function to:",cs:["Produce estrogen","Draw the ovum into the tube and move it toward the uterus","Destroy the ovum","Anchor the ovum in place permanently"],c:1,r:"Beating cilia in the uterine tube draw the ovum in and move it toward the uterus. This ciliary action is essential for normal reproductive transport."},
  {topic:"Cilia & Flagella",q:"Cilia are structurally composed of:",cs:["Actin filaments","Microtubules surrounded by a specialized part of the plasma membrane","Collagen fibers","Ribosomal RNA"],c:1,r:"Cilia consist of microtubules enclosed within an extension of the plasma membrane. This microtubule core allows cilia to bend and beat."},
  {topic:"Cilia & Flagella",q:"Motile cilia have a microtubule arrangement described as:",cs:["9 + 0","9 + 2","2 + 9","7 + 2"],c:1,r:"Motile cilia have 9 pairs of microtubules around the circumference plus a central pair, the \"9 + 2\" arrangement. This central pair is required for movement."},
  {topic:"Cilia & Flagella",q:"The nonmotile primary cilium has which microtubule arrangement, and why?",cs:["9 + 2, because it needs to move","9 + 0, because it lacks the central microtubule pair","0 + 9, because it has no outer microtubules","2 + 2, because it is very short"],c:1,r:"The primary cilium lacks the central pair of microtubules found in motile cilia. This gives it a \"9 + 0\" arrangement and no motility."},
  {topic:"Cilia & Flagella",q:"The primary cilium found on almost every cell in the body is believed to function mainly in:",cs:["Cell division","Sensory functions","Digestion","Hormone production"],c:1,r:"Primary cilia are believed to serve sensory roles, such as in retinal photoreceptors and kidney tubule fluid detection. Their exact function in most organs remains unclear."},
  {topic:"Cilia & Flagella",q:"Which human cells possess a flagellum?",cs:["Neutrophils","Macrophages","Sperm cells","Red blood cells"],c:2,r:"Sperm cells are the only cells in the body with a flagellum. This whiplike structure, built with a 9 + 2 microtubule arrangement, propels the sperm."},

  {topic:"Microvilli",q:"Microvilli primarily function to:",cs:["Increase surface area for rapid diffusion and absorption","Move mucus along a surface","Propel the cell through fluid","Detect light"],c:0,r:"Microvilli are fingerlike projections that increase membrane surface area. This aids rapid diffusion and absorption, such as of digestion products."},
  {topic:"Microvilli",q:"Besides the intestine, microvilli are also found in the:",cs:["Retina","Kidney tubule epithelium","Uterine tube","Respiratory airway"],c:1,r:"Microvilli are also found in kidney tubule epithelium, where reabsorption of filtered molecules occurs. This parallels their absorptive role in the intestine."},
  {topic:"Microvilli",q:"Microvilli that increase absorptive surface area in the intestine are located on the:",cs:["Basal membrane","Apical membrane facing the lumen","Nuclear membrane","Lateral membrane facing neighboring cells"],c:1,r:"Microvilli project from the apical surface, which faces the intestinal lumen. This location maximizes contact with digested nutrients for absorption."},
];

const TOPIC_COLORS={
  "All Topics":{dot:"#3dd68c"},
  "Cell Basics":{dot:"#818cf8"},
  "Membrane Structure":{dot:"#f59e0b"},
  "Phagocytosis":{dot:"#34d399"},
  "Endocytosis":{dot:"#f472b6"},
  "Exocytosis":{dot:"#38bdf8"},
  "Cilia & Flagella":{dot:"#a78bfa"},
  "Microvilli":{dot:"#fb7185"},
};



const ALL_TOPICS=["All Topics",...new Set(MASTER.map(q=>q.topic))];

let selTopic="All Topics";
let ddOpen=false;
let quizItems=[];
let userAnswers={};
let checkedItems={};
let isReviewMode=false;
let wrongLog={};

const LABELS=['A','B','C','D'];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function buildItems(pool,doShuffle,forReview=false){
  const src=doShuffle?shuffle([...pool]):[...pool];
  return src.map((q,i)=>{
    const indexed=q.cs.map((t,idx)=>({t,ok:idx===q.c}));
    shuffle(indexed);
    return{
      id:forReview?q.origId:i,
      origId:forReview?q.origId:i,
      topic:q.topic,q:q.q,
      choices:indexed.map(x=>x.t),
      correct:indexed.findIndex(x=>x.ok),
      reason:q.r,
      prevWrongChoice:forReview?q.prevWrongChoice:null,
      prevWrongText:forReview?q.prevWrongText:null,
    };
  });
}

function getPool(){return selTopic==="All Topics"?MASTER:MASTER.filter(q=>q.topic===selTopic)}

function buildDropdown(){
  const dd=document.getElementById('cdd');
  dd.innerHTML='';
  ALL_TOPICS.forEach(t=>{
    const cnt=t==="All Topics"?MASTER.length:MASTER.filter(q=>q.topic===t).length;
    const col=TOPIC_COLORS[t]||{dot:"#64748b"};
    const el=document.createElement('div');
    el.className='combo-opt'+(t===selTopic?' sel':'');
    el.innerHTML=`<span class="opt-dot" style="background:${col.dot}"></span><span>${t}</span><span class="opt-cnt">${cnt}</span>`;
    el.onclick=()=>pickTopic(t);
    dd.appendChild(el);
  });
}

function toggleDD(){ddOpen=!ddOpen;document.getElementById('cdd').classList.toggle('open',ddOpen);document.getElementById('ctrig').classList.toggle('open',ddOpen)}
function closeDD(){ddOpen=false;document.getElementById('cdd').classList.remove('open');document.getElementById('ctrig').classList.remove('open')}
function pickTopic(t){
  selTopic=t;
  const col=TOPIC_COLORS[t]||{dot:"#64748b"};
  document.getElementById('clbl').textContent=t;
  document.getElementById('cdot').style.background=col.dot;
  buildDropdown();closeDD();
  exitReviewSilent();
  applyFilter(false);
}
document.addEventListener('click',e=>{if(!document.getElementById('cwrap').contains(e.target))closeDD()});

function applyFilter(doShuffle){
  isReviewMode=false;
  quizItems=buildItems(getPool(),doShuffle);
  userAnswers={};checkedItems={};
  renderList();
  document.getElementById('result-screen').style.display='none';
  document.getElementById('q-list').style.display='flex';
  document.getElementById('submit-row').style.display='flex';
  document.getElementById('mode-banner').classList.remove('show');
  document.getElementById('rbadge').classList.remove('on');
  updateScore();
  updateReviewBtn();
}

function randomize(){
  const svg=document.querySelector('.rnd-btn svg');
  svg.style.transform='rotate(360deg)';
  setTimeout(()=>svg.style.transform='',500);
  document.getElementById('sbadge').classList.add('on');
  exitReviewSilent();
  applyFilter(true);
}

function updateReviewBtn(){
  const wrongKeys=Object.keys(wrongLog);
  const btn=document.getElementById('review-btn');
  const badge=document.getElementById('wrong-count-badge');
  if(wrongKeys.length>0){
    btn.disabled=false;
    badge.textContent=wrongKeys.length;
    badge.classList.add('show');
  } else {
    btn.disabled=true;
    badge.classList.remove('show');
  }
}

function startReview(){
  if(Object.keys(wrongLog).length===0)return;
  isReviewMode=true;
  document.getElementById('sbadge').classList.remove('on');
  document.getElementById('rbadge').classList.add('on');

  const reviewPool=Object.values(wrongLog).map(w=>({
    origId:w.origId,
    topic:w.topic,
    q:w.q,
    cs:w.choices,
    c:w.correctIdx,
    r:w.reason,
    prevWrongChoice:w.userAnswerIdx,
    prevWrongText:w.userAnswerText,
  }));

  quizItems=buildItems(reviewPool,false,true);
  userAnswers={};checkedItems={};

  const banner=document.getElementById('mode-banner');
  document.getElementById('mode-banner-txt').textContent=`Review mode — ${quizItems.length} wrongly answered question${quizItems.length>1?'s':''} from your last attempt. Try them again!`;
  banner.classList.add('show');

  document.getElementById('result-screen').style.display='none';
  document.getElementById('q-list').style.display='flex';
  document.getElementById('submit-row').style.display='flex';
  renderList(true);
  updateScore();
}

function exitReview(){
  exitReviewSilent();
  applyFilter(false);
}
function exitReviewSilent(){
  isReviewMode=false;
  document.getElementById('rbadge').classList.remove('on');
  document.getElementById('mode-banner').classList.remove('show');
}

function renderList(isReview=false){
  const list=document.getElementById('q-list');
  list.innerHTML='';
  quizItems.forEach((q,i)=>{
    const col=TOPIC_COLORS[q.topic]||{dot:"#60a5fa"};
    const card=document.createElement('div');
    card.className='q-card'+(isReview?' review-card':'');
    card.id='qcard-'+i;

    const opts=q.choices.map((ch,ci)=>`<option value="${ci}">${LABELS[ci]}. ${ch}</option>`).join('');
    const prevHtml=isReview&&q.prevWrongText
      ?`<div class="prev-answer-row show">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span style="color:#64748b">Previous wrong answer:</span>
          <span class="prev-wrong-chip">${q.prevWrongText}</span>
        </div>`
      :'';

    card.innerHTML=`
      <div class="q-meta">
        <span class="q-idx">${isReview?'Review':'Q'}${i+1}${isReview?' of '+quizItems.length:' of '+quizItems.length}</span>
        <span class="q-topic-pill" style="color:${col.dot};border-color:${col.dot}44">${q.topic}</span>
        ${isReview?'<span class="wrong-pill">Previously wrong</span>':''}
      </div>
      ${prevHtml}
      <div class="q-text">${q.q}</div>
      <div class="q-row">
        <div class="q-select-wrap">
          <select class="q-select" id="sel-${i}" onchange="onSelect(${i},this.value)">
            <option value="" disabled selected style="color:#64748b">— Select an answer —</option>
            ${opts}
          </select>
          <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <button class="check-btn" id="chk-${i}" onclick="checkOne(${i})" disabled>Check</button>
      </div>
      <div class="q-result" id="res-${i}">
        <div class="result-icon" id="res-icon-${i}"></div>
        <span class="result-txt" id="res-txt-${i}"></span>
      </div>
      <div class="result-reason" id="reason-${i}">${q.reason}</div>
    `;
    list.appendChild(card);
  });
}

function onSelect(i,val){
  userAnswers[i]=parseInt(val);
  const btn=document.getElementById('chk-'+i);
  if(!checkedItems[i])btn.disabled=false;
}

function checkOne(i){
  if(userAnswers[i]===undefined||checkedItems[i])return;
  checkedItems[i]=true;
  const q=quizItems[i];
  const correct=userAnswers[i]===q.correct;
  const card=document.getElementById('qcard-'+i);
  const resEl=document.getElementById('res-'+i);
  const icon=document.getElementById('res-icon-'+i);
  const txt=document.getElementById('res-txt-'+i);
  const reason=document.getElementById('reason-'+i);
  const sel=document.getElementById('sel-'+i);
  const btn=document.getElementById('chk-'+i);

  sel.disabled=true;
  btn.disabled=true;
  btn.textContent=correct?'✓':'✗';
  btn.style.background=correct?'#1a4731':'#2b0d0d';
  btn.style.color=correct?'#3dd68c':'#f87171';
  btn.style.borderColor=correct?'#3dd68c55':'#f8717155';

  card.classList.remove('review-card');
  card.classList.add(correct?'answered-correct':'answered-wrong');
  resEl.className='q-result show '+(correct?'result-correct':'result-wrong');
  icon.textContent=correct?'✓':'✗';
  txt.textContent=correct
    ?'Correct! '+LABELS[q.correct]+' is right.'
    :`Wrong. Correct answer: ${LABELS[q.correct]}. ${q.choices[q.correct]}`;
  reason.classList.add('show');

  const masterKey=isReviewMode?q.origId:i;
  if(!correct){
    wrongLog[masterKey]={
      origId:masterKey,
      topic:q.topic,q:q.q,
      choices:q.choices,
      correctIdx:q.correct,
      reason:q.reason,
      userAnswerIdx:userAnswers[i],
      userAnswerText:LABELS[userAnswers[i]]+'. '+q.choices[userAnswers[i]],
    };
  } else {
    delete wrongLog[masterKey];
  }

  updateScore();
  updateReviewBtn();
}

function updateScore(){
  const total=Object.keys(checkedItems).length;
  const cor=Object.keys(checkedItems).filter(i=>userAnswers[i]===quizItems[i].correct).length;
  const wrg=total-cor;
  const pct=total>0?Math.round((cor/total)*100)+'%':'—';
  document.getElementById('sc-total').textContent=quizItems.length;
  document.getElementById('sc-correct').textContent=cor;
  document.getElementById('sc-wrong').textContent=wrg;
  document.getElementById('sc-pct').textContent=pct;
}

function submitAll(){
  quizItems.forEach((_,i)=>{
    if(!checkedItems[i]&&userAnswers[i]!==undefined)checkOne(i);
  });
  const unanswered=quizItems.filter((_,i)=>userAnswers[i]===undefined&&!checkedItems[i]);
  if(unanswered.length>0){
    const el=document.getElementById('qcard-'+unanswered[0].id);
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  showResult();
}

function showResult(){
  document.getElementById('q-list').style.display='none';
  document.getElementById('submit-row').style.display='none';
  document.getElementById('mode-banner').classList.remove('show');
  const rs=document.getElementById('result-screen');
  rs.style.display='block';
  const total=quizItems.length;
  const cor=Object.keys(checkedItems).filter(i=>userAnswers[i]===quizItems[i].correct).length;
  const wrong=total-cor;
  const pct=total>0?Math.round((cor/total)*100):0;
  const grade=pct>=90?'Excellent! 🎉':pct>=75?'Good work! 👍':pct>=60?'Keep studying! 📖':'Needs more review 💪';
  const dots=quizItems.map((_,i)=>{
    const ok=userAnswers[i]===quizItems[i].correct;
    return`<span class="q-dot" style="background:${checkedItems[i]?(ok?'#3dd68c':'#f87171'):'#2a3244'}" title="Q${i+1}: ${checkedItems[i]?(ok?'Correct':'Wrong'):'Unanswered'}"></span>`;
  }).join('');

  const hasWrong=Object.keys(wrongLog).length>0;

  rs.innerHTML=`
    <div class="result-score">${cor}/${total}</div>
    <div class="result-label">${pct}% — ${grade}</div>
    <div class="res-breakdown">
      <div class="sc"><div class="sc-num" style="color:#3dd68c">${cor}</div><div class="sc-lbl">Correct</div></div>
      <div class="sc"><div class="sc-num" style="color:#f87171">${wrong}</div><div class="sc-lbl">Wrong</div></div>
      <div class="sc"><div class="sc-num" style="color:#f59e0b">${Object.keys(wrongLog).length}</div><div class="sc-lbl">To review</div></div>
    </div>
    <div class="indicators">${dots}</div>
    <div class="res-btns">
      <button class="res-btn" onclick="restart()" style="background:#161b27;color:#cbd5e1;border:0.5px solid #2a3244">↺ Restart</button>
      ${hasWrong?`<button class="res-btn" onclick="startReviewFromResult()" style="background:#2b1a0d;color:#f59e0b;border:0.5px solid #f59e0b55">⚑ Review ${Object.keys(wrongLog).length} wrong</button>`:''}
      <button class="res-btn" onclick="randomize()" style="background:#1a2a40;color:#60a5fa;border:0.5px solid #3a6ea8">🔀 Randomize</button>
    </div>`;
}

function startReviewFromResult(){
  document.getElementById('result-screen').style.display='none';
  startReview();
}

function restart(){
  wrongLog={};
  userAnswers={};checkedItems={};
  isReviewMode=false;
  quizItems=buildItems(getPool(),false);
  renderList();
  document.getElementById('result-screen').style.display='none';
  document.getElementById('q-list').style.display='flex';
  document.getElementById('submit-row').style.display='flex';
  document.getElementById('sbadge').classList.remove('on');
  document.getElementById('rbadge').classList.remove('on');
  document.getElementById('mode-banner').classList.remove('show');
  updateScore();
  updateReviewBtn();
}

buildDropdown();
document.getElementById('cdot').style.background=TOPIC_COLORS["All Topics"].dot;
applyFilter(false);
</script>
